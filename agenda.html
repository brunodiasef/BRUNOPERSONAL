<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Agenda · Bruno Personal</title>
<link rel="manifest" href="agenda-manifest.json">
<meta name="theme-color" content="#0B0C10">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0C10; --surface:#15171F; --surface-2:#1C1F2A; --surface-3:#262A38;
    --border:#272B38; --text:#F1F0EC; --text-soft:#989BAC; --text-faint:#6A6D7C;
    --blue:#4C6BFF; --blue-dim:rgba(76,107,255,0.16);
    --amber:#F2A93B; --amber-dim:rgba(242,169,59,0.16);
    --green:#33C97A; --green-dim:rgba(51,201,122,0.16);
    --red:#FF5C4D; --red-dim:rgba(255,92,77,0.16);
    --purple:#B07CFF; --purple-dim:rgba(176,124,255,0.16);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom));}
  button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;}
  input,select{font-family:inherit;font-size:16px;}
  h1,h2,h3{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}

  /* topo */
  .top{position:sticky;top:0;z-index:20;background:rgba(11,12,16,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top);}
  .top-row{display:flex;align-items:center;gap:10px;padding:10px 0;}
  .top-row img{width:44px;height:28px;object-fit:contain;}
  .top-row h1{font-size:18px;flex:1;}
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;}
  .seg button{background:none;color:var(--text-soft);font-weight:600;font-size:13px;padding:7px 14px;border-radius:8px;}
  .seg button.on{background:var(--blue);color:#fff;}
  .nav{display:flex;align-items:center;gap:8px;padding:0 0 10px;}
  .nav .arrow{width:38px;height:38px;border-radius:10px;background:var(--surface-2);color:var(--text);font-size:18px;}
  .nav .label{flex:1;text-align:center;}
  .nav .label b{display:block;font-family:'Oswald',sans-serif;font-size:17px;text-transform:uppercase;letter-spacing:.03em;}
  .nav .label span{font-size:12px;color:var(--text-soft);}
  .today-btn{background:var(--surface-2);color:var(--text);font-size:12px;font-weight:600;padding:0 12px;height:38px;border-radius:10px;}

  .summary{display:flex;gap:8px;margin:14px 0 6px;flex-wrap:wrap;}
  .pill{font-size:12px;font-weight:600;padding:6px 10px;border-radius:20px;background:var(--surface-2);color:var(--text-soft);}
  .pill b{color:var(--text);}
  .pill.alt{background:var(--amber-dim);color:var(--amber);}
  .pill.alt b{color:var(--amber);}

  /* dia */
  .slot{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .slot:last-child{border-bottom:none;}
  .slot.now .time{color:var(--blue);}
  .slot.past{opacity:.55;}
  .time{width:58px;flex-shrink:0;font-family:'Oswald',sans-serif;font-size:20px;font-weight:600;padding-top:6px;}
  .time small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:var(--text-faint);letter-spacing:0;}
  .time small.full{color:var(--red);}
  .people{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .p{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;color:var(--text);font-size:15px;font-weight:600;}
  .p .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .p .tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;white-space:nowrap;}
  .p.swap{border-left-color:var(--amber);} .p.swap .tag{background:var(--amber-dim);color:var(--amber);}
  .p.moved-in{border-left-color:var(--purple);} .p.moved-in .tag{background:var(--purple-dim);color:var(--purple);}
  .p.extra{border-left-color:var(--green);} .p.extra .tag{background:var(--green-dim);color:var(--green);}
  .p.off{border-left-color:var(--surface-3);background:transparent;color:var(--text-faint);}
  .p.off .n{text-decoration:line-through;}
  .p.off .tag{background:var(--red-dim);color:var(--red);}
  .add{width:100%;background:none;border:1.5px dashed var(--border);color:var(--text-soft);font-size:13px;font-weight:600;padding:8px 12px;border-radius:10px;text-align:left;}
  .add:active{border-color:var(--green);color:var(--green);}
  .empty{text-align:center;color:var(--text-soft);padding:48px 16px;font-size:14px;line-height:1.6;}
  .empty b{display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;color:var(--text);font-size:18px;margin-bottom:4px;}

  /* semana */
  .day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin:12px 0;cursor:pointer;width:100%;text-align:left;color:var(--text);display:block;}
  .day-card.today{border-color:var(--blue);}
  .day-card .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;}
  .day-card .dh h3{font-size:16px;}
  .day-card .dh span{font-size:12px;color:var(--text-soft);}
  .day-card .dh .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--text-soft);}
  .day-card .dh .cnt.alt{color:var(--amber);}
  .wl{display:flex;gap:10px;font-size:13.5px;padding:3px 0;}
  .wl .t{width:44px;flex-shrink:0;font-weight:700;color:var(--text-soft);font-variant-numeric:tabular-nums;}
  .wl .ns{flex:1;min-width:0;}
  .wl .x{color:var(--text-faint);text-decoration:line-through;}
  .wl .a{color:var(--amber);font-weight:600;}
  .wl .m{color:var(--purple);font-weight:600;}
  .wl .e{color:var(--green);font-weight:600;}
  .wl-empty{font-size:13px;color:var(--text-faint);}

  /* botão encaixar */
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:15px 24px;border-radius:30px;box-shadow:0 10px 28px rgba(0,0,0,.5);}

  /* folha de ações */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;border-top:1px solid var(--border);padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto;}
  .sheet.open{transform:none;}
  .grab{width:40px;height:4px;border-radius:4px;background:var(--surface-3);margin:4px auto 14px;}
  .sheet h2{font-size:19px;margin-bottom:2px;}
  .sheet .sub{font-size:13px;color:var(--text-soft);margin-bottom:16px;}
  .act{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface-2);color:var(--text);font-size:15px;font-weight:600;padding:14px;border-radius:12px;margin-bottom:8px;text-align:left;}
  .act .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .act small{display:block;font-size:12px;font-weight:500;color:var(--text-soft);margin-top:2px;}
  .act.danger{color:var(--red);}
  label.f{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em;}
  .in{width:100%;background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);border-radius:10px;padding:12px;outline:none;}
  .in:focus{border-color:var(--blue);}
  select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-soft) 50%),linear-gradient(135deg,var(--text-soft) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;}
  .row2{display:flex;gap:8px;margin-top:18px;}
  .btn{flex:1;padding:14px;border-radius:12px;font-weight:700;font-size:15px;}
  .btn.pri{background:var(--blue);color:#fff;}
  .btn.ghost{background:var(--surface-2);color:var(--text);}
  .btn:disabled{opacity:.5;}

  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login .card{width:100%;max-width:340px;text-align:center;}
  .login img{width:200px;max-width:70%;margin-bottom:18px;}
  .login h1{font-size:22px;margin-bottom:6px;}
  .login p{font-size:13px;color:var(--text-soft);margin:0 0 18px;}
  .login .err{background:var(--red-dim);color:var(--red);font-size:13px;padding:10px;border-radius:10px;margin-bottom:12px;}
  .login .btn{width:100%;margin-top:10px;}

  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--surface-3);color:var(--text);font-size:13.5px;font-weight:600;padding:11px 16px;border-radius:12px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading{min-height:60vh;display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:14px;}
</style>
</head>
<body>
<div id="app"><div class="loading">Carregando…</div></div>
<div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Agenda do Bruno — horários do dia e da semana com
   substituições pontuais (só valem para aquele dia).
   - Horários fixos: lidos do cadastro de alunos do app principal
     (só nome, horário e "suspenso"; as fotos das avaliações não são baixadas).
   - Substituições: gravadas à parte em /agendaAjustes/{data}/{id},
     sem alterar o cadastro dos alunos.
   ========================================================= */
const DB = "https://bruno-personal-1fb4b-default-rtdb.firebaseio.com";
const SESSION_KEY = 'bp_agenda_sessao';
const DAY_KEYS = ['domingo','segunda','terca','quarta','quinta','sexta','sabado']; // índice = getDay()
const DAY_NAMES = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DAY_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CAPACITY = 3;

let students = [];          // [{id, name, suspended, schedule}]
let adjustments = {};       // { 'YYYY-MM-DD': { id: ajuste } }
let view = 'dia';
let current = startOfDay(new Date());
let sheetOpen = false;

/* ---------- utilidades ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function iso(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function monday(d){ const x = startOfDay(d); const g = x.getDay(); return addDays(x, g===0 ? -6 : 1-g); }
function fmtShort(d){ return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function firstName(n){ return String(n||'').trim().split(/\s+/).slice(0,2).join(' '); }
function toMin(t){ const [h,m] = String(t||'0:0').split(':').map(Number); return h*60+(m||0); }
function sortTimes(a,b){ return toMin(a)-toMin(b); }

async function api(path, opts){
  const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 15000);
  try{
    const res = await fetch(`${DB}/${path}.json`, {...(opts||{}), signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP '+res.status);
    return await res.json();
  } finally { clearTimeout(timer); }
}
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ---------- dados ---------- */
// Busca só os campos necessários de cada aluno (o cadastro completo tem as fotos e pesa ~2,4 MB)
async function loadStudentsLight(){
  const res = await fetch(`${DB}/ptManagerData/students.json?shallow=true`);
  const shallow = await res.json() || {};
  const idx = Object.keys(shallow);
  const list = await Promise.all(idx.map(async i=>{
    const [id, name, suspended, schedule] = await Promise.all(
      ['id','name','suspended','schedule'].map(f=>api(`ptManagerData/students/${i}/${f}`).catch(()=>null))
    );
    return { id: id || ('idx'+i), name: name || 'Sem nome', suspended: !!suspended, schedule: schedule || {} };
  }));
  students = list.sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}));
}
let writeSeq = 0; // muda a cada gravação: uma leitura que começou antes dela fica desatualizada
async function loadAdjustments(from, to){
  const q = `orderBy=${encodeURIComponent('"$key"')}&startAt=${encodeURIComponent('"'+from+'"')}&endAt=${encodeURIComponent('"'+to+'"')}`;
  const seq = writeSeq;
  const res = await fetch(`${DB}/agendaAjustes.json?${q}`);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json() || {};
  if(seq !== writeSeq) return; // houve gravação durante a leitura: descarta para não apagar o que acabou de ser salvo
  // limpa o intervalo carregado e coloca o que veio do banco
  for(let d = new Date(from+'T00:00'); iso(d) <= to; d = addDays(d,1)) delete adjustments[iso(d)];
  Object.assign(adjustments, data);
}
function visibleRange(){
  if(view === 'semana'){ const m = monday(current); return [iso(m), iso(addDays(m,5))]; }
  return [iso(current), iso(current)];
}
async function refreshAdjustments(){
  const [a,b] = visibleRange();
  await loadAdjustments(a,b);
}
function findStudent(id){ return students.find(s=>s.id===id); }
function nameOf(id, fallback){ const s = findStudent(id); return s ? s.name : (fallback || 'Aluno'); }

/* Monta a agenda de um dia: horários fixos + substituições daquele dia */
function buildDay(date){
  const dayKey = DAY_KEYS[date.getDay()];
  const items = [];
  students.forEach(s=>{
    if(s.suspended) return;
    const sc = s.schedule && s.schedule[dayKey];
    if(sc && sc.active && sc.time) items.push({ kind:'fixo', sid:s.id, name:s.name, time:sc.time, origTime:sc.time });
  });
  const adj = Object.values(adjustments[iso(date)] || {});
  const findFixed = (sid, time)=> items.find(it=>it.kind==='fixo' && it.sid===sid && it.origTime===time && !it.adj);
  adj.forEach(a=>{
    if(a.type === 'cancel'){
      const it = findFixed(a.sid, a.time); if(it){ it.adj = a; it.kind = 'cancel'; }
    } else if(a.type === 'swap'){
      const it = findFixed(a.sid, a.time);
      if(it){ it.adj = a; it.kind = 'swap'; it.fromName = it.name; it.name = a.toSid ? nameOf(a.toSid, a.toName) : a.toName; it.toSid = a.toSid || null; }
    } else if(a.type === 'move'){
      const it = findFixed(a.sid, a.from);
      if(it){ it.adj = a; it.kind = 'moved-out'; it.toTime = a.to; }
      items.push({ kind:'moved-in', sid:a.sid, name:nameOf(a.sid, a.name), time:a.to, origTime:a.from, adj:a });
    } else if(a.type === 'extra'){
      items.push({ kind:'extra', sid:a.toSid || null, name: a.toSid ? nameOf(a.toSid, a.toName) : a.toName, time:a.time, adj:a, note:a.note||'' });
    }
  });
  const byTime = {};
  items.forEach(it=>{ (byTime[it.time] = byTime[it.time] || []).push(it); });
  const times = Object.keys(byTime).sort(sortTimes);
  const order = {fixo:0, swap:1, 'moved-in':2, extra:3, cancel:4, 'moved-out':5};
  times.forEach(t=>byTime[t].sort((a,b)=>order[a.kind]-order[b.kind] || a.name.localeCompare(b.name,'pt-BR')));
  const active = items.filter(it=>it.kind!=='cancel' && it.kind!=='moved-out');
  return { times, byTime, total: active.length, changes: adj.length };
}
const isActive = it => it.kind!=='cancel' && it.kind!=='moved-out';

/* ---------- telas ---------- */
function render(){
  if(!sessionOk()){ renderLogin(); return; }
  const app = document.getElementById('app');
  const isToday = iso(current) === iso(new Date());
  let navLabel, navSub;
  if(view === 'dia'){
    navLabel = `${DAY_NAMES[current.getDay()]}`;
    navSub = `${fmtShort(current)}${isToday ? ' · hoje' : ''}`;
  } else {
    const m = monday(current), s = addDays(m,5);
    navLabel = 'Semana';
    navSub = `${fmtShort(m)} – ${fmtShort(s)}`;
  }
  app.innerHTML = `
    <div class="top"><div class="wrap">
      <div class="top-row">
        <img src="abertura-logo.png" alt="">
        <h1>Agenda</h1>
        <div class="seg">
          <button class="${view==='dia'?'on':''}" onclick="setView('dia')">Dia</button>
          <button class="${view==='semana'?'on':''}" onclick="setView('semana')">Semana</button>
        </div>
      </div>
      <div class="nav">
        <button class="arrow" onclick="shift(-1)" aria-label="Anterior">‹</button>
        <div class="label"><b>${navLabel}</b><span>${navSub}</span></div>
        <button class="arrow" onclick="shift(1)" aria-label="Próximo">›</button>
        <button class="today-btn" onclick="goToday()">Hoje</button>
      </div>
    </div></div>
    <div class="wrap">${view==='dia' ? renderDay() : renderWeek()}</div>
    ${view==='dia' && current.getDay()!==0 ? `<button class="fab" onclick="openExtra()">+ Adicionar aluno</button>` : ''}`;
}

function renderDay(){
  if(current.getDay() === 0) return `<div class="empty"><b>Domingo</b>Sem aulas fixas.</div>`;
  const d = buildDay(current);
  if(!d.times.length) return `<div class="empty"><b>Dia livre</b>Nenhum aluno com horário neste dia.<br>Encaixar“Encaixar aula” para marcar uma aula avulsa.</div>`;
  const now = new Date(), isToday = iso(current) === iso(now), nowMin = now.getHours()*60 + now.getMinutes();
  let nextMarked = false;
  const slots = d.times.map(t=>{
    const list = d.byTime[t];
    const n = list.filter(isActive).length;
    let cls = '';
    if(isToday){
      if(toMin(t) + 60 <= nowMin) cls = 'past';
      else if(!nextMarked && n){ cls = 'now'; nextMarked = true; }
    }
    const people = list.map(it=>{
      let tag = '', c = '';
      if(it.kind==='swap'){ c='swap'; tag = `no lugar de ${esc(firstName(it.fromName))}`; }
      else if(it.kind==='moved-in'){ c='moved-in'; tag = `veio das ${esc(it.origTime)}`; }
      else if(it.kind==='extra'){ c='extra'; tag = it.note ? esc(it.note) : 'adicionado'; }
      else if(it.kind==='cancel'){ c='off'; tag = 'cancelado'; }
      else if(it.kind==='moved-out'){ c='off'; tag = `foi para ${esc(it.toTime)}`; }
      return `<button class="p ${c}" onclick='openSlot(${JSON.stringify({sid:it.sid, time:it.time, origTime:it.origTime||it.time, adj: it.adj ? it.adj.id : null, kind: it.kind})})'>
        <span class="n">${esc(it.name)}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</button>`;
    }).join('');
    const add = n < CAPACITY ? `<button class="add" onclick="openExtra('${esc(t)}')">+ Adicionar aluno</button>` : '';
    return `<div class="slot ${cls}"><div class="time">${esc(t)}<small class="${n>CAPACITY?'full':''}">${n}/${CAPACITY}</small></div><div class="people">${people}${add}</div></div>`;
  }).join('');
  return `<div class="summary">
      <span class="pill"><b>${d.total}</b> ${d.total===1?'aula':'aulas'}</span>
      <span class="pill"><b>${d.times.filter(t=>d.byTime[t].some(isActive)).length}</b> horários</span>
      ${d.changes ? `<span class="pill alt"><b>${d.changes}</b> ${d.changes===1?'alteração':'alterações'}</span>` : ''}
    </div>${slots}`;
}

function renderWeek(){
  const m = monday(current), today = iso(new Date());
  let total = 0, changes = 0;
  const cards = [0,1,2,3,4,5].map(i=>{
    const date = addDays(m,i), d = buildDay(date);
    total += d.total; changes += d.changes;
    const lines = d.times.map(t=>{
      const names = d.byTime[t].map(it=>{
        const n = esc(firstName(it.name));
        if(it.kind==='cancel') return `<span class="x">${n}</span>`;
        if(it.kind==='moved-out') return `<span class="x">${n}</span>`;
        if(it.kind==='swap') return `<span class="a">${n}</span>`;
        if(it.kind==='moved-in') return `<span class="m">${n}</span>`;
        if(it.kind==='extra') return `<span class="e">${n}</span>`;
        return n;
      }).join(', ');
      return `<div class="wl"><span class="t">${esc(t)}</span><span class="ns">${names}</span></div>`;
    }).join('') || `<div class="wl-empty">Sem aulas</div>`;
    return `<button class="day-card ${iso(date)===today?'today':''}" onclick="openDay('${iso(date)}')">
      <div class="dh"><h3>${DAY_NAMES[date.getDay()]}</h3><span>${fmtShort(date)}</span>
        <span class="cnt ${d.changes?'alt':''}">${d.total} ${d.total===1?'aula':'aulas'}${d.changes?` · ${d.changes} alt.`:''}</span></div>
      ${lines}</button>`;
  }).join('');
  return `<div class="summary">
      <span class="pill"><b>${total}</b> aulas na semana</span>
      ${changes ? `<span class="pill alt"><b>${changes}</b> ${changes===1?'alteração':'alterações'}</span>` : ''}
    </div>${cards}`;
}

function renderLogin(err){
  document.getElementById('app').innerHTML = `
    <div class="login"><div class="card">
      <img src="abertura-logo.png" alt="Bruno Personal Trainer">
      <h1>Agenda</h1>
      <p>Digite sua senha de administrador.</p>
      ${err ? `<div class="err">${esc(err)}</div>` : ''}
      <input type="password" id="pass" class="in" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn pri" id="login-btn" onclick="doLogin()">Entrar</button>
    </div></div>`;
  setTimeout(()=>{ const i = document.getElementById('pass'); if(i) i.focus(); }, 50);
}

/* ---------- navegação ---------- */
async function setView(v){ view = v; render(); await reloadVisible(); }
async function shift(n){ current = addDays(current, view==='dia' ? n : 7*n); render(); await reloadVisible(); }
async function goToday(){ current = startOfDay(new Date()); render(); await reloadVisible(); }
async function openDay(dateISO){ current = new Date(dateISO+'T00:00'); view = 'dia'; render(); await reloadVisible(); }
async function reloadVisible(){
  try{ await refreshAdjustments(); if(!sheetOpen) render(); }
  catch(e){ toast('Sem conexão. Tentando de novo…'); }
}

/* ---------- login (mesma senha do admin do app) ---------- */
function sessionOk(){ try{ return localStorage.getItem(SESSION_KEY)==='1'; }catch(e){ return false; } }
async function doLogin(){
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('login-btn'); btn.disabled = true; btn.textContent = 'Entrando…';
  try{
    const real = await api('ptManagerData/adminPassword');
    if(pass && pass === real){
      try{ localStorage.setItem(SESSION_KEY,'1'); }catch(e){}
      await start();
    } else renderLogin('Senha incorreta.');
  }catch(e){ renderLogin('Sem conexão. Tente de novo.'); }
}

/* ---------- folha de ações ---------- */
function openSheet(html){
  const sh = document.getElementById('sheet');
  sh.innerHTML = `<div class="grab"></div>${html}`;
  sheetOpen = true;
  document.getElementById('backdrop').classList.add('open'); sh.classList.add('open');
}
function closeSheet(){
  sheetOpen = false;
  document.getElementById('backdrop').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
}
function studentOptions(selected){
  return `<option value="">— escolha o aluno —</option>` +
    students.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?'selected':''}>${esc(s.name)}${s.suspended?' (suspenso)':''}</option>`).join('') +
    `<option value="__outro">Outra pessoa (digitar nome)…</option>`;
}
function toggleOther(sel){ document.getElementById('other-wrap').style.display = sel.value==='__outro' ? 'block' : 'none'; }
function dayLabel(){ return `${DAY_NAMES[current.getDay()]}, ${fmtShort(current)}`; }

let ctx = null; // horário/aluno tocado
function openSlot(c){
  ctx = c;
  const date = iso(current);
  const a = c.adj ? (adjustments[date]||{})[c.adj] : null;
  const name = c.kind==='extra' || c.kind==='swap' ? (a && (a.toSid ? nameOf(a.toSid, a.toName) : a.toName)) : nameOf(c.sid);
  if(a){
    const what = { cancel:'Aula cancelada neste dia', swap:`Substituição: ${nameOf(a.sid, a.name)} → ${a.toSid ? nameOf(a.toSid,a.toName) : a.toName}`,
      move:`Remarcado de ${a.from} para ${a.to}`, extra:'Aluno adicionado só neste dia' }[a.type];
    openSheet(`<h2>${esc(name)}</h2><div class="sub">${esc(dayLabel())} · ${esc(c.time)}<br>${esc(what)}</div>
      <button class="act danger" onclick="undo('${a.id}')"><span class="ic" style="background:var(--red-dim)">↺</span><span>${a.type==='extra'?'Remover aluno deste dia':'Desfazer alteração'}<small>${a.type==='extra'?'Tira o aluno deste horário':'Volta ao horário fixo'}</small></span></button>
      <button class="act" onclick="closeSheet()"><span class="ic" style="background:var(--surface-3)">✕</span>Fechar</button>`);
    return;
  }
  openSheet(`<h2>${esc(name)}</h2><div class="sub">${esc(dayLabel())} · ${esc(c.time)} · só neste dia</div>
    <button class="act" onclick="formSwap()"><span class="ic" style="background:var(--amber-dim);color:var(--amber)">⇄</span><span>Trocar por outro aluno<small>Outra pessoa vem neste horário</small></span></button>
    <button class="act" onclick="formMove()"><span class="ic" style="background:var(--purple-dim);color:var(--purple)">⏱</span><span>Mudar o horário<small>Ex.: das ${esc(c.time)} para outro horário</small></span></button>
    <button class="act danger" onclick="saveCancel()"><span class="ic" style="background:var(--red-dim)">✕</span><span>Cancelar neste dia<small>O horário fica livre</small></span></button>`);
}
function formSwap(){
  openSheet(`<h2>Trocar aluno</h2><div class="sub">${esc(dayLabel())} · ${esc(ctx.time)} · no lugar de ${esc(nameOf(ctx.sid))}</div>
    <label class="f">Quem vem</label>
    <select class="in" id="to" onchange="toggleOther(this)">${studentOptions('')}</select>
    <div id="other-wrap" style="display:none"><label class="f">Nome</label><input class="in" id="other" placeholder="Nome da pessoa"></div>
    <div class="row2"><button class="btn ghost" onclick="openSlot(ctx)">Voltar</button><button class="btn pri" onclick="saveSwap(this)">Salvar</button></div>`);
}
function formMove(){
  openSheet(`<h2>Mudar horário</h2><div class="sub">${esc(nameOf(ctx.sid))} · ${esc(dayLabel())}</div>
    <label class="f">De ${esc(ctx.time)} para</label>
    <input type="time" class="in" id="newtime" value="${esc(ctx.time)}" step="300">
    <div class="row2"><button class="btn ghost" onclick="openSlot(ctx)">Voltar</button><button class="btn pri" onclick="saveMove(this)">Salvar</button></div>`);
}
function openExtra(time){
  openSheet(`<h2>Adicionar aluno</h2><div class="sub">${esc(dayLabel())}${time ? ' · '+esc(time) : ''} · só neste dia</div>
    <label class="f">Horário</label><input type="time" class="in" id="time" step="300" value="${esc(time||'')}">
    <label class="f">Aluno</label>
    <select class="in" id="to" onchange="toggleOther(this)">${studentOptions('')}</select>
    <div id="other-wrap" style="display:none"><label class="f">Nome</label><input class="in" id="other" placeholder="Nome da pessoa"></div>
    <label class="f">Observação (opcional)</label><input class="in" id="note" placeholder="Ex.: reposição, aula experimental" maxlength="40">
    <div class="row2"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn pri" onclick="saveExtra(this)">Salvar</button></div>`);
}
function readWho(){
  const v = document.getElementById('to').value;
  if(!v) return null;
  if(v === '__outro'){ const n = document.getElementById('other').value.trim(); return n ? { toSid:null, toName:n } : null; }
  return { toSid:v, toName:nameOf(v) };
}

/* ---------- gravação ---------- */
async function putAdj(a, btn){
  const date = iso(current);
  if(btn){ btn.disabled = true; btn.textContent = 'Salvando…'; }
  try{
    a.id = a.id || uid(); a.createdAt = new Date().toISOString();
    writeSeq++;
    await api(`agendaAjustes/${date}/${a.id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(a) });
    (adjustments[date] = adjustments[date] || {})[a.id] = a;
    closeSheet(); render(); toast('Alteração salva para ' + fmtShort(current));
  }catch(e){
    if(btn){ btn.disabled = false; btn.textContent = 'Salvar'; }
    toast('Não foi possível salvar. Verifique a internet.');
  }
}
function saveCancel(){ putAdj({ type:'cancel', sid:ctx.sid, name:nameOf(ctx.sid), time:ctx.time }); }
function saveSwap(btn){
  const who = readWho(); if(!who){ toast('Escolha quem vem.'); return; }
  if(who.toSid === ctx.sid){ toast('Escolha outra pessoa.'); return; }
  putAdj({ type:'swap', sid:ctx.sid, name:nameOf(ctx.sid), time:ctx.time, ...who }, btn);
}
function saveMove(btn){
  const to = document.getElementById('newtime').value;
  if(!to){ toast('Escolha o novo horário.'); return; }
  if(to === ctx.time){ toast('Escolha um horário diferente.'); return; }
  putAdj({ type:'move', sid:ctx.sid, name:nameOf(ctx.sid), from:ctx.time, to }, btn);
}
function saveExtra(btn){
  const time = document.getElementById('time').value;
  if(!time){ toast('Escolha o horário.'); return; }
  const who = readWho(); if(!who){ toast('Escolha o aluno.'); return; }
  putAdj({ type:'extra', time, note: document.getElementById('note').value.trim(), ...who }, btn);
}
async function undo(id){
  const date = iso(current);
  try{
    writeSeq++;
    await api(`agendaAjustes/${date}/${id}`, { method:'DELETE' });
    if(adjustments[date]) delete adjustments[date][id];
    closeSheet(); render(); toast('Alteração desfeita');
  }catch(e){ toast('Não foi possível desfazer. Verifique a internet.'); }
}

/* ---------- início ---------- */
async function start(){
  document.getElementById('app').innerHTML = `<div class="loading">Carregando horários…</div>`;
  try{
    await Promise.all([loadStudentsLight(), refreshAdjustments()]);
    render();
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="empty"><b>Sem conexão</b>Não foi possível carregar a agenda.<br><br><button class="btn pri" style="flex:none;padding:12px 22px" onclick="start()">Tentar de novo</button></div>`;
    return;
  }
  // mantém atualizado (ex.: alteração feita em outro aparelho)
  clearInterval(start._a); clearInterval(start._s);
  start._a = setInterval(()=>{ if(!sheetOpen && document.visibilityState==='visible') reloadVisible(); }, 15000);
  start._s = setInterval(async ()=>{ if(!sheetOpen && document.visibilityState==='visible'){ try{ await loadStudentsLight(); render(); }catch(e){} } }, 180000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && !sheetOpen) reloadVisible(); });
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(sessionOk()) start(); else renderLogin();
</script>
