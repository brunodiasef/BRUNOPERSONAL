  body{margin:0;font-family:'Inter',sans-serif;background:var(--chalk);color:var(--ink);}
  h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;margin:0;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;}
  input,select{font-family:'Inter',sans-serif;}
  #app{min-height:100vh;}

  /* ---------- LOGIN ---------- */
  .login-wrap{display:flex;min-height:100vh;}
  .login-side{flex:1.1;background:var(--graphite);color:var(--chalk);display:flex;flex-direction:column;justify-content:center;padding:60px;position:relative;overflow:hidden;}
  .login-side::before{content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border:2px solid rgba(246,244,239,0.08);border-radius:50%;}
  .login-side::after{content:"";position:absolute;right:-40px;bottom:-160px;width:260px;height:260px;border:2px solid rgba(242,169,59,0.15);border-radius:50%;}
  .brand-mark{font-family:'Oswald',sans-serif;font-size:14px;letter-spacing:0.35em;color:var(--amber);margin-bottom:18px;}
  .login-side h1{font-size:52px;line-height:1.02;max-width:460px;}
  .login-side p{color:#B9BAC4;max-width:420px;margin-top:18px;font-size:15px;line-height:1.6;}
  .score-row{display:flex;gap:26px;margin-top:46px;}
  .score-item .num{font-family:'Oswald',sans-serif;font-size:34px;color:var(--amber);}
  .score-item .lbl{font-size:11px;color:#9698A5;text-transform:uppercase;letter-spacing:0.08em;}
  .login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;}
  .login-card{width:100%;max-width:360px;}
  .role-btn{width:100%;padding:18px;margin-bottom:14px;border-radius:10px;background:#fff;border:1.5px solid var(--border);font-size:16px;font-weight:600;text-align:left;display:flex;align-items:center;gap:14px;transition:.15s;}
  .role-btn:hover{border-color:var(--blue);background:var(--blue-dim);}
  .role-icon{width:38px;height:38px;border-radius:8px;background:var(--graphite);color:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:15px;}
  .field-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .input{width:100%;padding:12px 14px;border-radius:8px;border:1.5px solid var(--border);font-size:15px;margin-bottom:16px;background:#fff;}
  .input:focus{outline:none;border-color:var(--blue);}
  .btn{padding:13px 20px;border-radius:8px;font-weight:600;font-size:14px;}
  .btn-primary{background:var(--blue);color:#fff;width:100%;}
  .btn-primary:hover{background:#1e3fc4;}
  .btn-ghost{background:transparent;color:var(--ink-soft);font-size:13px;margin-top:14px;text-decoration:underline;}
  .login-error{background:var(--red-dim);color:var(--red);padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;font-weight:600;}
  .login-hint{background:var(--amber-dim);color:#8a5c05;padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:14px;line-height:1.5;}

  /* ---------- APP SHELL ---------- */
  .topbar{background:var(--graphite);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:14px 26px;}
  .topbar .tb-left{display:flex;align-items:center;gap:12px;}
  .tb-badge{width:34px;height:34px;border-radius:8px;background:var(--amber);color:var(--graphite);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;}
  .tb-title{font-family:'Oswald';font-size:18px;letter-spacing:.04em;}
  .tb-sub{font-size:11px;color:#9698A5;text-transform:uppercase;letter-spacing:.08em;}
  .tb-right{display:flex;gap:10px;align-items:center;}
  .tb-btn{background:rgba(255,255,255,0.08);color:#fff;padding:9px 14px;border-radius:7px;font-size:13px;font-weight:600;}
  .tb-btn:hover{background:rgba(255,255,255,0.16);}

  .layout{display:flex;min-height:calc(100vh - 62px);}
  .sidebar{width:270px;background:var(--chalk-2);border-right:1px solid var(--border);padding:20px;flex-shrink:0;}
  .sidebar h3{font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
  .student-item{padding:12px 14px;border-radius:9px;margin-bottom:8px;cursor:pointer;background:#fff;border:1.5px solid transparent;}
  .student-item:hover{border-color:var(--blue);}
  .student-item.active{background:var(--graphite);border-color:var(--graphite);}
  .student-item.active .s-name{color:#fff;}
  .student-item.active .s-plan{color:#B9BAC4;}
  .s-name{font-weight:600;font-size:14.5px;}
  .s-plan{font-size:11.5px;color:var(--ink-soft);margin-top:2px;text-transform:capitalize;}
  .add-student-btn{width:100%;padding:11px;border-radius:8px;background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;margin-bottom:16px;}
  .add-student-btn:hover{background:#1e3fc4;}
  .main{flex:1;padding:28px 34px;overflow-x:auto;}

  /* overview cards */
  .cards-row{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:28px;}
  .score-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:20px 24px;min-width:190px;flex:1;}
  .score-card .lbl{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .score-card .val{font-family:'Oswald';font-size:32px;margin-top:6px;}
  .score-card.accent-blue .val{color:var(--blue);}
  .score-card.accent-amber .val{color:#c98107;}
  .score-card.accent-green .val{color:var(--green);}
  .score-card.accent-red{border-color:var(--red);}
  .score-card.accent-red .lbl{color:var(--red);}
  .score-card.accent-red .val{color:var(--red);}

  .empty-state{text-align:center;padding:80px 20px;color:var(--ink-soft);}
  .empty-state h2{color:var(--ink);margin-bottom:10px;}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1.5px solid var(--border);}
  .tab-btn{padding:11px 18px;background:none;font-weight:600;font-size:14px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1.5px;}
  .tab-btn.active{color:var(--blue);border-color:var(--blue);}

  .panel{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;}
  .panel h4{font-size:14px;margin-bottom:16px;color:var(--ink-soft);}
  .form-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .form-group{display:flex;flex-direction:column;}
  .form-group .input{margin-bottom:0;min-width:150px;}

  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;padding:10px 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);border-bottom:1.5px solid var(--border);}
  td{padding:11px 8px;border-bottom:1px solid var(--border);}
  .del-link{color:var(--red);background:none;font-size:12.5px;font-weight:600;}
  .type-pill{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;text-transform:uppercase;}
  .type-semanal{background:var(--blue-dim);color:var(--blue);}
  .type-mensal{background:var(--amber-dim);color:#8a5c05;}

  /* training week grid */
  .week-nav{display:flex;align-items:center;gap:14px;margin-bottom:18px;}
  .week-nav .wk-label{font-family:'Oswald';font-size:15px;}
  .wk-btn{background:var(--chalk-2);padding:8px 14px;border-radius:7px;font-weight:600;font-size:13px;}
  .wk-btn:hover{background:var(--border);}
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:26px;}
  .day-tile{border:1.5px solid var(--border);border-radius:12px;padding:14px 12px;min-height:150px;background:var(--chalk);cursor:pointer;display:flex;flex-direction:column;}
  .day-tile:hover{border-color:var(--blue);}
  .day-tile.readonly{cursor:default;}
  .day-tile.readonly.aluno-clickable{cursor:pointer;}
  .day-tile.readonly.aluno-clickable:hover{border-color:var(--amber);}
  .day-tile.filled-comigo{background:var(--blue-dim);border-color:var(--blue);}
  .day-tile.filled-sozinho{background:var(--amber-dim);border-color:var(--amber);}
  .day-name{font-family:'Oswald';font-size:13px;letter-spacing:.04em;}
  .day-date{font-size:11px;color:var(--ink-soft);margin-bottom:8px;}
  .day-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:6px;width:fit-content;}
  .day-tag.comigo{background:var(--blue);color:#fff;}
  .day-tag.sozinho{background:var(--amber);color:#5c3d00;}
  .day-empty-lbl{font-size:12px;color:#B7B5AA;margin-top:auto;}
  .muscle-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;}
  .muscle-badge{color:var(--ink-soft);padding:2px 8px;font-size:10.5px;font-weight:700;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(21,22,27,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:18px;margin-bottom:4px;}
  .modal .modal-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;text-transform:none;letter-spacing:0;font-family:'Inter';}
  .radio-row{display:flex;gap:10px;margin-bottom:18px;}
  .radio-opt{flex:1;border:1.5px solid var(--border);border-radius:9px;padding:11px;text-align:center;font-weight:600;font-size:13.5px;cursor:pointer;}
  .radio-opt.sel-comigo{background:var(--blue);color:#fff;border-color:var(--blue);}
  .radio-opt.sel-sozinho{background:var(--amber);color:#5c3d00;border-color:var(--amber);}
  .radio-opt.sel-falta{background:var(--red);color:#fff;border-color:var(--red);}
  .day-tag.falta{background:var(--red);color:#fff;}
  .day-tile.filled-falta{background:var(--red-dim);border-color:var(--red);}
  .day-tile.scheduled-auto{background:var(--blue-dim);border-style:dashed;}
  .muscle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
  .muscle-check{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13px;cursor:pointer;}
  .muscle-check.checked{border-color:var(--blue);background:var(--blue-dim);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .btn{flex:1;}
  .btn-secondary{background:var(--chalk-2);color:var(--ink);}
  .btn-danger{background:var(--red-dim);color:var(--red);}

  .field-inline{display:flex;flex-direction:column;margin-bottom:16px;}
  .save-bar{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  /* horário */
  .horario-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .horario-table th,.horario-table td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
  .horario-table th{background:var(--chalk-2);font-family:'Oswald';font-size:11.5px;letter-spacing:.03em;}
  .horario-slot{background:var(--blue);color:#fff;border-radius:6px;padding:4px 6px;font-size:11px;font-weight:700;white-space:nowrap;}
  .sched-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
  .sched-row label{display:flex;align-items:center;gap:8px;flex:1;font-size:13.5px;font-weight:600;}

  @media(max-width:900px){
    .login-wrap{flex-direction:column;}
    .login-side{padding:34px;}
    .layout{flex-direction:column;}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);}
    .board{grid-template-columns:repeat(2,1fr);}
    .main{padding:20px;}
  }
</style>
</head>

   CONFIGURAÇÃO DO BANCO DE DADOS (Firebase Realtime Database)
   ------------------------------------------------------------
   1. Crie um projeto gratuito em https://console.firebase.google.com
   2. No menu lateral, abra "Realtime Database" e clique em "Criar banco de dados"
      (escolha "Modo de teste" para começar rápido).
   3. Copie a URL do banco (algo como
      "https://SEU-PROJETO-default-rtdb.firebaseio.com") e cole abaixo,
      substituindo o texto entre aspas.
   ============================================================ */
const FIREBASE_DB_URL = "https://bruno-personal-1fb4b-default-rtdb.firebaseio.com";

const STORAGE_KEY = 'ptManagerData';
let DATA = { adminPassword:'admin123', students:[] };
let dataReady = false;
let storageUnavailable = false;
let lastSavedSnapshot = '';

function dbConfigured(){
  return FIREBASE_DB_URL && !FIREBASE_DB_URL.includes('COLE_AQUI');
}

function normalizeData(data){
  if(!data || typeof data !== 'object') data = {};
  if(!data.adminPassword) data.adminPassword = 'admin123';
  if(!Array.isArray(data.students)) data.students = data.students ? Object.values(data.students) : [];
  data.students = data.students.map(s=>{
    if(!Array.isArray(s.payments)) s.payments = s.payments ? Object.values(s.payments) : [];
    if(!Array.isArray(s.trainings)) s.trainings = s.trainings ? Object.values(s.trainings) : [];
    s.trainings = s.trainings.map(t=>({...t, muscles: Array.isArray(t.muscles) ? t.muscles : []}));
    if(!s.schedule) s.schedule = defaultSchedule();
    SCHEDULE_DAYS.forEach(d=>{ if(!s.schedule[d]) s.schedule[d] = {active:false, time:'18:00'}; });
    return s;
  });
  return data;
}

async function loadDataAsync(){
  if(!dbConfigured()){ storageUnavailable = true; return; }
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${STORAGE_KEY}.json`);
    const json = await res.json();
    if(json){
      DATA = normalizeData(json);
    } else {
      DATA = { adminPassword:'admin123', students:[] };
      await saveData();
    }
  }catch(err){
    storageUnavailable = true;
  }
  lastSavedSnapshot = JSON.stringify(DATA);
  dataReady = true;
}

async function saveData(){
  if(!dbConfigured()) return;
  try{
    await fetch(`${FIREBASE_DB_URL}/${STORAGE_KEY}.json`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(DATA)
    });
    lastSavedSnapshot = JSON.stringify(DATA);
  }catch(err){
    console.error('Erro ao salvar dados', err);
    alert('Não foi possível salvar agora. Verifique sua conexão com a internet e tente novamente.');
  }
}

async function pollForUpdates(){
  if(storageUnavailable || !dbConfigured()) return;
  // não atualiza durante edições ativas, para não perder o que está sendo digitado
  if(modalDate || showNewStudentModal || showChangePassModal) return;
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${STORAGE_KEY}.json`);
    const json = await res.json();
    const asString = JSON.stringify(json||{});
    if(json && asString !== lastSavedSnapshot){
      DATA = normalizeData(json);
      lastSavedSnapshot = asString;
      render();
    }
  }catch(err){ /* silencioso */ }
}

function toISO(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtBR(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function money(v){ return 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

let finMonth = `${today.getFullYear()}-${pad(today.getMonth()+1)}`;
let finYear = String(today.getFullYear());
let treinoMonth = `${today.getFullYear()}-${pad(today.getMonth()+1)}`;

function getMonday(d){ const x=new Date(d); const day=x.getDay(); const diff = day===0? -6 : 1-day; x.setDate(x.getDate()+diff); x.setHours(0,0,0,0); return x; }
function getWeekDates(offset){
  const monday = getMonday(today);
  monday.setDate(monday.getDate()+offset*7);
  const arr=[];
  for(let i=0;i<6;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); arr.push(d); }
  return arr;
}

function findStudent(id){ return DATA.students.find(s=>s.id===id); }

function totalMonth(student, yearMonth){ // 'YYYY-MM'
  const [y,m]=yearMonth.split('-').map(Number);
  return student.payments.filter(p=>{const d=parseISO(p.date); return d.getFullYear()===y && (d.getMonth()+1)===m;}).reduce((s,p)=>s+Number(p.value),0);
}
function totalYear(student, year){
  return student.payments.filter(p=>parseISO(p.date).getFullYear()===Number(year)).reduce((s,p)=>s+Number(p.value),0);
}

function readScheduleFromInputs(prefix){
  const sc = {};
  SCHEDULE_DAYS.forEach((d,i)=>{
    const activeEl = document.getElementById(`${prefix}-active-${i}`);
    const timeEl = document.getElementById(`${prefix}-time-${i}`);
    sc[d] = { active: activeEl ? activeEl.checked : false, time: (timeEl && timeEl.value) ? timeEl.value : '18:00' };
  });
  return sc;
}
function scheduleConflicts(schedule, excludeId){
  const conflicts = [];
  SCHEDULE_DAYS.forEach((d,i)=>{
    const sc = schedule[d];
    if(!sc || !sc.active) return;
    const hour = parseInt((sc.time||'18:00').split(':')[0],10);
    const others = DATA.students.filter(s=>{
      if(s.id===excludeId) return false;
      const osc = getSchedule(s)[d];
      if(!osc || !osc.active) return false;
      const oh = parseInt((osc.time||'18:00').split(':')[0],10);
      return oh===hour;
    });
    if(others.length>=3){
      conflicts.push(`${WEEK_LABELS[i]} às ${sc.time} já está com 3 alunos (${others.map(o=>o.name).join(', ')}).`);
    }
  });
  return conflicts;
}
function addStudent(){
  const name=document.getElementById('ns-name').value.trim();
  const username=document.getElementById('ns-user').value.trim();
  const password=document.getElementById('ns-pass').value;
  const paymentType=document.getElementById('ns-type').value;
  const paymentValue=Number(document.getElementById('ns-value').value)||0;
  if(!name||!username||!password){ alert('Preencha nome, usuário e senha.'); return; }
  if(DATA.students.some(s=>s.username===username)){ alert('Esse nome de usuário já existe.'); return; }
  const schedule = readScheduleFromInputs('ns-sched');
  const conflicts = scheduleConflicts(schedule, null);
  if(conflicts.length){ alert('Não foi possível salvar a agenda — limite de 3 alunos por horário atingido:\n\n'+conflicts.join('\n')); return; }
  const student = {id:uid(), name, username, password, paymentType, paymentValue, payments:[], trainings:[], schedule};
  DATA.students.push(student);
  saveData();
  showNewStudentModal=false;
  selectedStudentId=student.id;
  render();
}
function deleteStudent(id){
  const s=findStudent(id);
  if(!confirm(`Excluir o aluno "${s.name}"? Todos os dados financeiros e de treino serão perdidos.`)) return;
  DATA.students = DATA.students.filter(s=>s.id!==id);
  saveData();
  if(selectedStudentId===id) selectedStudentId=null;
  render();
}
function saveProfile(id){
  const s=findStudent(id);
  s.name=document.getElementById('pf-name').value.trim();
  const newUser=document.getElementById('pf-user').value.trim();
  if(DATA.students.some(o=>o.username===newUser && o.id!==id)){ alert('Esse usuário já está em uso por outro aluno.'); return; }
  s.username=newUser;
  s.password=document.getElementById('pf-pass').value;
  s.paymentType=document.getElementById('pf-type').value;
  s.paymentValue=Number(document.getElementById('pf-value').value)||0;
  const newSchedule = readScheduleFromInputs('pf-sched');
  const conflicts = scheduleConflicts(newSchedule, id);
  if(conflicts.length){ alert('Não foi possível salvar a agenda — limite de 3 alunos por horário atingido:\n\n'+conflicts.join('\n')); return; }
  s.schedule = newSchedule;
  saveData();
  render();
  const bar=document.getElementById('pf-saved-msg'); if(bar){ bar.style.display='inline'; setTimeout(()=>{ if(bar) bar.style.display='none'; },1800); }
}

/* ============ AÇÕES: TREINO ============ */
function getSchedule(student){ return student.schedule || defaultSchedule(); }
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function countPrevistosNoMes(student, year, month){
  const schedule = getSchedule(student);
  const total = daysInMonth(year, month);
  let count = 0;
  for(let day=1; day<=total; day++){
    const wd = new Date(year, month-1, day).getDay(); // 0=Dom..6=Sáb
    if(wd===0) continue;
    const dayKey = SCHEDULE_DAYS[wd-1];
    if(schedule[dayKey] && schedule[dayKey].active) count++;
  }
  return count;
}
function weekdayIndexFromISO(iso){ const d=parseISO(iso); const day=d.getDay(); return day===0?6:day-1; }
function changeWeek(delta){ weekOffset+=delta; render(); }
function openTrainingModal(dateISO){
  const s=findStudent(selectedStudentId);
  const existing = s.trainings.find(t=>t.date===dateISO);
  const dayIdx = weekdayIndexFromISO(dateISO);
  const sched = getSchedule(s)[SCHEDULE_DAYS[dayIdx]] || {active:false,time:'18:00'};
  modalStudentId = selectedStudentId;
  modalAlunoMode = false;
  modalDate = dateISO;
  if(existing){
    modalType = existing.type;
    modalMuscles = existing.muscles ? [...existing.muscles] : [];
    modalTime = existing.time || (sched.active ? sched.time : '');
  } else {
    modalType = 'comigo';
    modalMuscles = [];
    modalTime = sched.active ? sched.time : '';
  }
  render();
}
function openTrainingModalAluno(dateISO){
  const s = findStudent(currentUser.studentId);
  const existing = s.trainings.find(t=>t.date===dateISO);
  if(existing && existing.type!=='sozinho') return;
  modalStudentId = s.id;
  modalAlunoMode = true;
  modalDate = dateISO;
  modalType = 'sozinho';
  modalMuscles = (existing && existing.muscles) ? [...existing.muscles] : [];
  modalTime = '';
  render();
}
function closeTrainingModal(){ modalDate=null; modalStudentId=null; modalAlunoMode=false; render(); }
function setModalType(t){ modalType=t; render(); }
function toggleModalMuscle(m){
  if(modalMuscles.includes(m)) modalMuscles = modalMuscles.filter(x=>x!==m);
  else modalMuscles.push(m);
  render();
}
function saveTraining(){
  const s=findStudent(modalStudentId);
  s.trainings = s.trainings.filter(t=>t.date!==modalDate);
  if(modalType==='falta'){
    s.trainings.push({id:uid(), date:modalDate, type:'falta', muscles:[], time:null});
  } else {
    if(modalMuscles.length===0){ alert('Selecione ao menos um grupamento muscular.'); return; }
    const entry = {id:uid(), date:modalDate, type:modalType, muscles:[...modalMuscles]};
    entry.time = modalType==='comigo' ? (modalTime || null) : null;
    s.trainings.push(entry);
  }
  saveData();
  modalDate=null; modalStudentId=null; modalAlunoMode=false;
  render();
}
function removeTrainingFromModal(){
  const s=findStudent(modalStudentId);
  s.trainings = s.trainings.filter(t=>t.date!==modalDate);
  saveData();
  modalDate=null; modalStudentId=null; modalAlunoMode=false;
  render();
}

/* ============ BACKUP ============ */
function exportBackup(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`backup-personal-${toISO(today)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function triggerImport(){ document.getElementById('import-file').click(); }
function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.students){ alert('Arquivo inválido.'); return; }
      if(!confirm('Isso vai substituir todos os dados atuais pelos dados do backup. Continuar?')) return;
      DATA = normalizeData(parsed);
      saveData();
      render();
    }catch(err){ alert('Não foi possível ler o arquivo.'); }
  };
  reader.readAsText(file);
}

/* ============ RENDER: MODAIS ============ */
function renderScheduleFields(prefix, schedule){
  return WEEK_LABELS.map((label,i)=>{
    const d = SCHEDULE_DAYS[i];
    const sc = (schedule && schedule[d]) || {active:false, time:'18:00'};
    return `<div class="sched-row">
      <label><input type="checkbox" id="${prefix}-active-${i}" ${sc.active?'checked':''}> ${label}</label>
      <input type="time" id="${prefix}-time-${i}" class="input" style="margin-bottom:0;width:110px;" value="${sc.time||'18:00'}">
    </div>`;
  }).join('');
}

function renderHorario(student){
  const schedule = getSchedule(student);
  const headerCells = HORARIO_DAYS_IDX.map(i=>`<th>${WEEK_LABELS[i]}</th>`).join('');
  const rows = HORARIO_HOURS.map(hour=>{
    const hourLbl = `${String(hour).padStart(2,'0')}:00`;
    const cells = HORARIO_DAYS_IDX.map(i=>{
      const sc = schedule[SCHEDULE_DAYS[i]];
      let content = '';
      if(sc && sc.active){
        const schHour = parseInt((sc.time||'18:00').split(':')[0],10);
        if(schHour===hour) content = `<div class="horario-slot">${student.name.split(' ')[0]} · ${sc.time}</div>`;
      }
      return `<td>${content}</td>`;
    }).join('');
    return `<tr><td style="font-weight:600;color:var(--ink-soft);">${hourLbl}</td>${cells}</tr>`;
  }).join('');
  return `
    <div class="panel">
      <h4>Agenda semanal (Segunda a Sexta, 05:00–22:00)</h4>
      <div style="overflow-x:auto;">
        <table class="horario-table">
          <thead><tr><th></th>${headerCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderHorarioGeral(readonly){
  const headerCells = HORARIO_DAYS_IDX.map(i=>`<th>${WEEK_LABELS[i]}</th>`).join('');
  const matrix = HORARIO_HOURS.map(hour=>{
    return HORARIO_DAYS_IDX.map(i=>{
      const dayKey = SCHEDULE_DAYS[i];
      return DATA.students.filter(s=>{
        const sc = getSchedule(s)[dayKey];
        if(!sc || !sc.active) return false;
        const h = parseInt((sc.time||'18:00').split(':')[0],10);
        return h===hour;
      });
    });
  });
  const rows = HORARIO_HOURS.map((hour,rowIdx)=>{
    const hourLbl = `${String(hour).padStart(2,'0')}:00`;
    const cells = HORARIO_DAYS_IDX.map((i,colIdx)=>{
      const matches = matrix[rowIdx][colIdx];
      let content = '';
      if(matches.length){
        const full = matches.length>=3;
        const slots = matches.map(s=>`<div class="horario-slot" style="background:${full?'var(--red)':'var(--blue)'};${readonly?'':'cursor:pointer;'}" ${readonly?'':`onclick="selectStudent('${s.id}')" title="Abrir aluno"`}>${s.name.split(' ')[0]}</div>`).join('');
        content = `<div style="display:flex;flex-direction:column;gap:3px;align-items:center;">${slots}<div style="font-size:9.5px;font-weight:700;color:${full?'var(--red)':'var(--ink-soft)'};">${matches.length}/3</div></div>`;
      }
      return `<td>${content}</td>`;
    }).join('');
    return `<tr><td style="font-weight:600;color:var(--ink-soft);">${hourLbl}</td>${cells}</tr>`;
  }).join('');
  const totalCells = HORARIO_DAYS_IDX.map((i,colIdx)=>{
    const totalAulas = matrix.filter(row=>row[colIdx].length>0).length;
    return `<td style="font-weight:700;color:var(--blue);">${totalAulas}</td>`;
  }).join('');
  const totalsRow = `<tr style="background:var(--chalk-2);"><td style="font-weight:700;color:var(--ink-soft);">Total de aulas</td>${totalCells}</tr>`;
  return `
    <h2 style="font-size:26px;margin-bottom:4px;">Horário Geral</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:18px;">Todos os alunos e horários cadastrados, de segunda a sexta (05:00–22:00). Cada horário aceita até 3 alunos ao mesmo tempo${readonly?'.':' — clique em um aluno para abrir o cadastro dele.'}</p>
    <div class="panel">
      <div style="overflow-x:auto;">
        <table class="horario-table">
          <thead><tr><th></th>${headerCells}</tr></thead>
          <tbody>${rows}${totalsRow}</tbody>
        </table>
      </div>
    </div>`;
}

          <div class="radio-opt ${modalType==='comigo'?'sel-comigo':''}" onclick="setModalType('comigo')">Treinou comigo</div>

/* ============ RENDER: FINANCEIRO ============ */
function renderFinanceiro(student, readonly){
  const sorted = [...student.payments].sort((a,b)=>b.date.localeCompare(a.date));
  const rows = sorted.map(p=>`
    <tr>
      <td>${fmtBR(p.date)}</td>
      <td>${money(p.value)}</td>
      <td><span class="type-pill type-${p.type}">${p.type}</span></td>
      ${readonly?'':`<td><button class="del-link" onclick="deletePayment('${student.id}','${p.id}')">excluir</button></td>`}
    </tr>`).join('') || `<tr><td colspan="4" style="color:var(--ink-soft);padding:20px 8px;">Nenhum pagamento registrado ainda.</td></tr>`;

  return `
    <div class="cards-row">
      <div class="score-card accent-blue">
        <div class="lbl">Total pago no mês</div>
        <div class="val">${money(totalMonth(student, finMonth))}</div>
        <input type="month" class="input" style="margin:10px 0 0;font-size:12.5px;padding:7px 10px;" value="${finMonth}" onchange="finMonth=this.value; render();">
      </div>
      <div class="score-card accent-green">
        <div class="lbl">Acumulado no ano</div>
        <div class="val">${money(totalYear(student, finYear))}</div>
        <input type="number" class="input" style="margin:10px 0 0;font-size:12.5px;padding:7px 10px;" value="${finYear}" onchange="finYear=this.value; render();">
      </div>
      <div class="score-card accent-amber">
        <div class="lbl">Plano contratado</div>
        <div class="val" style="font-size:22px;text-transform:capitalize;">${student.paymentType}</div>
        <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">${money(student.paymentValue)} por ${student.paymentType==='mensal'?'mês':'semana'}</div>
      </div>
    </div>

    ${readonly?'':`
    <div class="panel">
      <h4>Registrar novo pagamento</h4>
      <div class="form-row">
        <div class="form-group"><label class="field-label">Data</label><input type="date" id="pay-date" class="input" value="${toISO(today)}"></div>
        <div class="form-group"><label class="field-label">Valor (R$)</label><input type="number" id="pay-value" class="input" value="${student.paymentValue}"></div>
        <div class="form-group"><label class="field-label">Tipo</label>
          <select id="pay-type" class="input">
            <option value="mensal" ${student.paymentType==='mensal'?'selected':''}>Mensal</option>
            <option value="semanal" ${student.paymentType==='semanal'?'selected':''}>Semanal</option>
          </select>
        </div>
        <button class="btn btn-primary" style="margin-bottom:0;" onclick="addPayment('${student.id}')">+ Adicionar pagamento</button>
      </div>
    </div>`}

    <div class="panel">
      <h4>Histórico de pagamentos</h4>
      <table>
        <thead><tr><th>Data</th><th>Valor</th><th>Tipo</th>${readonly?'':'<th></th>'}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/* ============ RENDER: TREINO ============ */
function trainingTagLabel(type){ return type==='comigo' ? 'Comigo' : type==='sozinho' ? 'Sozinho' : 'Faltou'; }
function renderTreino(student, readonly){
  const weekDates = getWeekDates(weekOffset);
  const rangeLabel = `${fmtBR(toISO(weekDates[0]))} — ${fmtBR(toISO(weekDates[5]))}`;
  const schedule = getSchedule(student);
  const weekIsoSet = weekDates.map(d=>toISO(d));
  const weekEntries = student.trainings.filter(t=>weekIsoSet.includes(t.date));
  const previstosSemana = weekDates.filter((d,i)=> (schedule[SCHEDULE_DAYS[i]]||{}).active).length;
  const realizadosSemana = weekEntries.filter(t=>t.type==='comigo'||t.type==='sozinho').length;
  const faltasSemana = weekEntries.filter(t=>t.type==='falta').length;

  const tiles = weekDates.map((d,i)=>{
    const iso = toISO(d);
    const entry = student.trainings.find(t=>t.date===iso);
    const sched = schedule[SCHEDULE_DAYS[i]] || {active:false,time:'18:00'};
    let cls='day-tile';
    let onclickAttr = '';
    if(!readonly){
      cls += '';
      onclickAttr = `onclick="openTrainingModal('${iso}')"`;
    } else {
      cls += ' readonly';
      const alunoCanMark = (!entry && !sched.active) || (entry && entry.type==='sozinho');
      if(alunoCanMark){
        cls += ' aluno-clickable';
        onclickAttr = `onclick="openTrainingModalAluno('${iso}')"`;
      }
    }
    let bodyHtml;
    if(entry){
      cls += entry.type==='comigo' ? ' filled-comigo' : entry.type==='sozinho' ? ' filled-sozinho' : ' filled-falta';
      const badges = (entry.muscles||[]).map(m=>{
        return `<span class="muscle-badge">${m}</span>`;
      }).join('');
      const timeLbl = entry.type==='comigo' && entry.time ? ` · ${entry.time}` : '';
      bodyHtml = `<span class="day-tag ${entry.type}">${trainingTagLabel(entry.type)}${timeLbl}</span><div class="muscle-badges">${badges}</div>`;
    } else if(sched.active){
      cls += ' scheduled-auto';
      bodyHtml = `<span class="day-tag comigo">Previsto · ${sched.time}</span><div class="day-empty-lbl">${readonly?'':'Clique para confirmar ou editar'}</div>`;
    } else {
      const emptyLbl = readonly ? 'Clique para marcar que treinou sozinho' : 'Clique para marcar';
      bodyHtml = `<div class="day-empty-lbl">${emptyLbl}</div>`;
    }
    return `
      <div class="${cls}" ${onclickAttr}>
        <div class="day-name">${WEEK_SHORT[i]}</div>
        <div class="day-date">${fmtBR(iso)}</div>
        ${bodyHtml}
      </div>`;
  }).join('');

  const [ty, tm] = treinoMonth.split('-').map(Number);
  const monthHistory = student.trainings.filter(t=>t.date.startsWith(treinoMonth)).sort((a,b)=>b.date.localeCompare(a.date));
  const historyRows = monthHistory.map(t=>{
    const badges = (t.muscles||[]).map(m=>{
      return `<span class="muscle-badge">${m}</span>`;
    }).join(' ');
    const timeLbl = t.type==='comigo' && t.time ? ` · ${t.time}` : '';
    return `<tr>
      <td>${fmtBR(t.date)}</td>
      <td><span class="day-tag ${t.type}" style="display:inline-block;">${trainingTagLabel(t.type)}${timeLbl}</span></td>
      <td>${badges}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="3" style="color:var(--ink-soft);padding:20px 8px;">Nenhum treino registrado neste mês.</td></tr>`;

  const previstosMes = countPrevistosNoMes(student, ty, tm);
  const realizadosMes = monthHistory.filter(t=>t.type==='comigo'||t.type==='sozinho').length;
  const faltasMes = monthHistory.filter(t=>t.type==='falta').length;

  return `
    <div class="week-nav">
      <button class="wk-btn" onclick="changeWeek(-1)">← Semana anterior</button>
      <div class="wk-label">${rangeLabel}${weekOffset===0?' (semana atual)':''}</div>
      <button class="wk-btn" onclick="changeWeek(1)">Próxima semana →</button>
    </div>
    <div class="cards-row" style="margin-bottom:20px;">
      <div class="score-card accent-blue"><div class="lbl">Treinos previstos na semana</div><div class="val">${previstosSemana}</div></div>
      <div class="score-card accent-green"><div class="lbl">Treinos realizados</div><div class="val">${realizadosSemana}</div></div>
      <div class="score-card accent-red"><div class="lbl">Faltas na semana</div><div class="val">${faltasSemana}</div></div>
    </div>
    <div class="board">${tiles}</div>
    <div class="panel">
      <h4>Histórico do mês</h4>
      <div class="form-row" style="margin-bottom:16px;">
        <div class="form-group"><label class="field-label">Mês</label><input type="month" class="input" style="margin-bottom:0;" value="${treinoMonth}" onchange="treinoMonth=this.value; render();"></div>
      </div>
      <div class="cards-row" style="margin-bottom:20px;">
        <div class="score-card accent-blue"><div class="lbl">Treinos previstos no mês</div><div class="val">${previstosMes}</div></div>
        <div class="score-card accent-green"><div class="lbl">Treinos realizados no mês</div><div class="val">${realizadosMes}</div></div>
        <div class="score-card accent-red"><div class="lbl">Faltas no mês</div><div class="val">${faltasMes}</div></div>
      </div>
      <table>
        <thead><tr><th>Data</th><th>Tipo</th><th>Grupamento muscular</th></tr></thead>
        <tbody>${historyRows}</tbody>
      </table>
    </div>`;
}

/* ============ RENDER: ADMIN APP ============ */
function renderAdminApp(){
  const students = DATA.students;
  const thisMonthKey = `${today.getFullYear()}-${pad(today.getMonth()+1)}`;
  const totalMesTodos = students.reduce((s,st)=>s+totalMonth(st, thisMonthKey),0);
  const totalAnoTodos = students.reduce((s,st)=>s+totalYear(st, today.getFullYear()),0);
  const sidebarItems = students.map(s=>`
    <div class="student-item ${selectedStudentId===s.id?'active':''}" onclick="selectStudent('${s.id}')">
      <div class="s-name">${s.name}</div>
      <div class="s-plan">${s.paymentType} · ${money(s.paymentValue)}</div>
    </div>`).join('') || `<div style="color:var(--ink-soft);font-size:13px;padding:10px 4px;">Nenhum aluno ainda.</div>`;
  const sidebarSummary = `
    <div style="margin-top:14px;padding-top:14px;border-top:1.5px solid var(--border);font-size:12.5px;color:var(--ink-soft);">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Total de alunos</span><b style="color:var(--ink);">${students.length}</b></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Recebido no mês</span><b style="color:var(--blue);">${money(totalMesTodos)}</b></div>
      <div style="display:flex;justify-content:space-between;"><span>Acumulado no ano</span><b style="color:var(--green);">${money(totalAnoTodos)}</b></div>
    </div>`;

  let mainContent = '';
  const student = selectedStudentId ? findStudent(selectedStudentId) : null;

  if(showGeneralSchedule){
    mainContent = renderHorarioGeral(false);
  } else if(!student){
    const totalMes = totalMesTodos;
    const totalAno = totalAnoTodos;
    mainContent = `
      <div class="cards-row">
        <div class="score-card accent-blue"><div class="lbl">Alunos ativos</div><div class="val">${students.length}</div></div>
        <div class="score-card accent-green"><div class="lbl">Recebido este mês (todos)</div><div class="val">${money(totalMes)}</div></div>
        <div class="score-card accent-amber"><div class="lbl">Acumulado neste ano (todos)</div><div class="val">${money(totalAno)}</div></div>
      </div>
      <div class="empty-state">
        <h2>Selecione um aluno</h2>
        <p>Escolha um aluno na lista ao lado para ver o financeiro e os treinos, ou cadastre um novo aluno.</p>
      </div>`;
  } else {
    mainContent = `
      <h2 style="font-size:26px;margin-bottom:4px;">${student.name}</h2>
      <p style="color:var(--ink-soft);font-size:13px;margin-bottom:18px;">Usuário: ${student.username}</p>
      <div class="tabs">
        <button class="tab-btn ${activeTab==='financeiro'?'active':''}" onclick="activeTab='financeiro';render()">Financeiro</button>
        <button class="tab-btn ${activeTab==='treino'?'active':''}" onclick="activeTab='treino';render()">Treino</button>
        <button class="tab-btn ${activeTab==='horario'?'active':''}" onclick="activeTab='horario';render()">Horário</button>
        <button class="tab-btn ${activeTab==='perfil'?'active':''}" onclick="activeTab='perfil';render()">Perfil</button>
      </div>
      ${activeTab==='financeiro' ? renderFinanceiro(student,false) : activeTab==='treino' ? renderTreino(student,false) : activeTab==='horario' ? renderHorario(student) : renderPerfil(student)}
    `;
  }

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="tb-left">
        <img src="${LOGO_URL}" alt="logo" style="width:38px;height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;">
        <div><div class="tb-title">Bruno Personal Trainer</div><div class="tb-sub">Administrador · BRUNOPERSONAL 27 998860938</div></div>
      </div>
      <div class="tb-right">
        <button class="tb-btn" onclick="goHome()">Página inicial</button>
        <button class="tb-btn" onclick="exportBackup()">Exportar backup</button>
        <button class="tb-btn" onclick="triggerImport()">Importar backup</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;" onchange="importBackup(event)">
        <button class="tb-btn" onclick="openChangePass()">Alterar senha</button>
        <button class="tb-btn" onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="layout">
      <div class="sidebar">
        <button class="add-student-btn" onclick="openNewStudentModal()">+ Novo aluno</button>
        <button class="add-student-btn" style="background:${showGeneralSchedule?'var(--blue)':'var(--graphite)'};margin-bottom:16px;" onclick="openGeneralSchedule()">📅 Horário Geral</button>
        <h3>Alunos</h3>
        ${sidebarItems}
        ${sidebarSummary}
      </div>
      <div class="main">${mainContent}</div>
    </div>
    ${renderNewStudentModal()}
    ${renderChangePassModal()}
    ${renderTrainingModal(false)}
  `;
}

/* ============ RENDER: ALUNO APP ============ */
function renderAlunoApp(){
  const student = findStudent(currentUser.studentId);
  if(!student){ logout(); return; }
  const content = activeTab==='financeiro' ? renderFinanceiro(student,true) : activeTab==='treino' ? renderTreino(student,true) : activeTab==='horario' ? renderHorario(student) : renderHorarioGeral(true);
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="tb-left">
        <img src="${LOGO_URL}" alt="logo" style="width:38px;height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;">
        <div><div class="tb-title">${student.name}</div><div class="tb-sub">Área do aluno · Bruno Personal Trainer · 27 998860938</div></div>
      </div>
      <div class="tb-right"><button class="tb-btn" onclick="logout()">Sair</button></div>
    </div>
    <div class="layout">
      <div class="main" style="width:100%;">
        <div class="tabs">
          <button class="tab-btn ${activeTab==='financeiro'?'active':''}" onclick="activeTab='financeiro';render()">Financeiro</button>
          <button class="tab-btn ${activeTab==='treino'?'active':''}" onclick="activeTab='treino';render()">Treino</button>
          <button class="tab-btn ${activeTab==='horario'?'active':''}" onclick="activeTab='horario';render()">Horário</button>
          <button class="tab-btn ${activeTab==='horarioGeral'?'active':''}" onclick="activeTab='horarioGeral';render()">Horário Geral</button>
        </div>
        ${content}
      </div>
    </div>
    ${renderTrainingModal(true)}

}

/* ============ RENDER PRINCIPAL ============ */
function render(){
  if(!currentUser){ renderLogin(); return; }
  if(currentUser.role==='admin'){ renderAdminApp(); }
  else { renderAlunoApp(); }
}

function renderLoadingScreen(){
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--graphite);color:#fff;">
      <img src="${LOGO_URL}" alt="logo" style="width:70px;height:70px;object-fit:contain;background:#fff;border-radius:14px;padding:6px;">
      <div style="font-family:'Oswald';letter-spacing:.05em;">Carregando dados...</div>
    </div>`;
}

function renderStorageErrorScreen(){
  const notConfigured = !dbConfigured();
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:var(--chalk);">
      <div style="max-width:460px;text-align:center;">
        <h2 style="margin-bottom:14px;">${notConfigured?'Banco de dados não configurado':'Não foi possível conectar ao banco de dados'}</h2>
        <p style="color:var(--ink-soft);font-size:14px;line-height:1.6;">
          ${notConfigured
            ? 'Abra o arquivo .html, encontre a linha <code>const FIREBASE_DB_URL = "COLE_AQUI_A_URL_DO_SEU_FIREBASE";</code> perto do início do &lt;script&gt; e cole a URL do seu banco Firebase Realtime Database no lugar do texto entre aspas.'
            : 'Verifique sua conexão com a internet e se a URL do Firebase configurada no arquivo está correta.'}
        </p>
      </div>
    </div>`;
}

(async function initApp(){
  renderLoadingScreen();
  await loadDataAsync();
  if(storageUnavailable){ renderStorageErrorScreen(); return; }
  render();
  setInterval(pollForUpdates, 4000);
})();
</script>
