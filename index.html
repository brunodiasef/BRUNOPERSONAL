    --amber-dim:rgba(242,169,59,0.16);
    --green:#33C97A;
    --green-dim:rgba(51,201,122,0.16);
    --red:#FF5C4D;
    --red-dim:rgba(255,92,77,0.16);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow-sm:0 2px 10px rgba(0,0,0,0.28);
    --shadow-md:0 10px 28px rgba(0,0,0,0.38);
    --shadow-lg:0 18px 46px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;margin:0;color:var(--text);}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent;}
  input,select{font-family:'Inter',sans-serif;}
  #app{min-height:100vh;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px;}

  /* ---------- LOGIN ---------- */
  .login-wrap{display:flex;min-height:100vh;background:var(--bg);}
  .login-side{flex:1.1;background:linear-gradient(180deg,#101219 0%,#0B0C10 100%);color:var(--text);display:flex;flex-direction:column;justify-content:center;padding:60px;position:relative;overflow:hidden;}
  .login-side::before{content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border:2px solid rgba(76,107,255,0.10);border-radius:50%;}
  .login-side::after{content:"";position:absolute;right:-40px;bottom:-160px;width:260px;height:260px;border:2px solid rgba(242,169,59,0.12);border-radius:50%;}
  .brand-mark{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:0.35em;color:var(--amber);margin-bottom:18px;}
  .login-side h1{font-size:44px;line-height:1.05;max-width:460px;}
  .login-side p{color:var(--text-soft);max-width:420px;margin-top:18px;font-size:15px;line-height:1.6;}
  .login-logo-inline{width:88px;height:88px;object-fit:contain;background:#fff;border-radius:var(--radius-md);padding:8px;margin-bottom:18px;box-shadow:var(--shadow-md);}
  .login-logo-float{display:none;}
  @media(min-width:901px){
    .login-side h1{font-size:52px;}
    .login-logo-inline{display:none;}
    .login-logo-float{display:block;position:absolute;right:9%;top:50%;transform:translateY(-50%);width:280px;height:280px;object-fit:contain;background:#fff;border-radius:28px;padding:20px;z-index:1;box-shadow:var(--shadow-lg);}
  }
  .score-row{display:flex;gap:26px;margin-top:46px;}
  .score-item .num{font-family:'Oswald',sans-serif;font-size:34px;color:var(--amber);}
  .score-item .lbl{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.08em;}
  .login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg);}
  .login-card{width:100%;max-width:360px;}
  .login-card > h2{color:var(--text);}
  .role-btn{width:100%;padding:16px;margin-bottom:14px;border-radius:var(--radius-md);background:var(--surface);border:1.5px solid var(--border);font-size:16px;font-weight:600;text-align:left;display:flex;align-items:center;gap:14px;color:var(--text);transition:.15s;box-shadow:var(--shadow-sm);}
  .role-btn:hover{border-color:var(--blue);background:var(--surface-2);transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .role-btn:active{transform:translateY(0);}
  .role-icon{width:38px;height:38px;border-radius:var(--radius-sm);background:var(--bg);color:var(--amber);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:15px;flex-shrink:0;}
  .field-label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-soft);margin-bottom:6px;display:block;}
  .input{width:100%;padding:13px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);font-size:15px;margin-bottom:16px;background:var(--surface-2);color:var(--text);transition:.15s;}
  .input::placeholder{color:var(--text-faint);}
  .input:focus{outline:none;border-color:var(--blue);background:var(--surface-3);}
  select.input option{background:var(--surface-2);color:var(--text);}
  .btn{padding:13px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:14px;transition:.15s;}
  .btn-primary{background:var(--blue);color:#fff;width:100%;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:#3651e0;box-shadow:var(--shadow-md);}
  .btn-ghost{background:transparent;color:var(--text-soft);font-size:13px;margin-top:14px;text-decoration:underline;}
  .login-error{background:var(--red-dim);color:var(--red);padding:11px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;font-weight:600;}
  .login-hint{background:var(--amber-dim);color:var(--amber);padding:11px 14px;border-radius:var(--radius-sm);font-size:12.5px;margin-bottom:14px;line-height:1.5;}

  /* ---------- APP SHELL ---------- */
  .topbar{background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow-sm);flex-wrap:wrap;}
  .topbar .tb-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .tb-badge{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--amber);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;flex-shrink:0;}
  .tb-title{font-family:'Oswald';font-size:17px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-sub{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-right{display:flex;gap:8px;align-items:center;overflow-x:auto;max-width:100%;scrollbar-width:thin;padding-bottom:2px;}
  .tb-btn{background:var(--surface-2);color:var(--text);padding:9px 14px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:.15s;}
  .tb-btn:hover{background:var(--surface-3);}

  .layout{display:flex;min-height:calc(100vh - 60px);}
  .sidebar{width:270px;background:var(--surface);border-right:1px solid var(--border);padding:18px;flex-shrink:0;}
  .sidebar h3{font-size:11.5px;color:var(--text-faint);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em;}
  .student-item{padding:12px 14px;border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;background:var(--surface-2);border:1.5px solid transparent;transition:.15s;}
  .student-item:hover{border-color:var(--blue);background:var(--surface-3);}
  .student-item.active{background:var(--blue);border-color:var(--blue);}
  .student-item.active .s-name{color:#fff;}
  .student-item.active .s-plan{color:rgba(255,255,255,0.75);}
  .s-name{font-weight:600;font-size:14px;color:var(--text);}
  .s-plan{font-size:11px;color:var(--text-faint);margin-top:2px;text-transform:capitalize;}
  .add-student-btn{width:100%;padding:11px;border-radius:var(--radius-sm);background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;margin-bottom:16px;}
  .add-student-btn:hover{background:#3651e0;}
  .main{flex:1;padding:26px 30px;overflow-x:hidden;min-width:0;}
  .mobile-student-select{display:none;}

  /* overview cards */
  .cards-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:26px;}
  .score-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:20px 22px;min-width:170px;flex:1;box-shadow:var(--shadow-sm);}
  .score-card .lbl{font-size:11px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .score-card .val{font-family:'Oswald';font-size:30px;margin-top:6px;color:var(--text);}
  .score-card.accent-blue .val{color:var(--blue);}
  .score-card.accent-amber .val{color:var(--amber);}
  .score-card.accent-green .val{color:var(--green);}
  .score-card.accent-red{border-color:var(--red);}
  .score-card.accent-red .lbl{color:var(--red);}
  .score-card.accent-red .val{color:var(--red);}

  .empty-state{text-align:center;padding:70px 20px;color:var(--text-soft);}
  .empty-state h2{color:var(--text);margin-bottom:10px;}
  .section-title{font-size:11.5px;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;}
  .big-cards{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:28px;}
  .big-card{flex:1;min-width:270px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-sm);}
  .big-card .top{display:flex;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1.5px solid var(--border);}
  .big-card h3{font-size:14px;color:var(--text);letter-spacing:.06em;}
  .stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border-soft);}
  .stat-row:last-child{border-bottom:none;}
  .stat-row .lbl{font-size:12.5px;color:var(--text-soft);}
  .stat-row .val{font-family:'Oswald';font-size:19px;}
  .chart-wrap{margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);}
  .chart-caption{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}

  /* tabs */
  .tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1.5px solid var(--border);overflow-x:auto;white-space:nowrap;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab-btn{padding:11px 16px;background:none;font-weight:600;font-size:13.5px;color:var(--text-soft);border-bottom:3px solid transparent;margin-bottom:-1.5px;flex-shrink:0;}
  .tab-btn.active{color:var(--blue);border-color:var(--blue);}

  .panel{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
  .panel h4{font-size:13px;margin-bottom:16px;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em;}
  .form-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}
  .form-group{display:flex;flex-direction:column;flex:1;min-width:140px;}
  .form-group .input{margin-bottom:0;min-width:0;}

  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:420px;}
  th{text-align:left;padding:10px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);border-bottom:1.5px solid var(--border);white-space:nowrap;}
  td{padding:11px 8px;border-bottom:1px solid var(--border-soft);color:var(--text);}
  .del-link{color:var(--red);background:none;font-size:12.5px;font-weight:600;}
  .type-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;}
  .type-semanal{background:var(--blue-dim);color:var(--blue);}
  .type-mensal{background:var(--amber-dim);color:var(--amber);}

  /* training week grid */
  .week-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
  .week-nav .wk-label{font-family:'Oswald';font-size:14px;color:var(--text);}
  .wk-btn{background:var(--surface-2);color:var(--text);padding:9px 14px;border-radius:var(--radius-sm);font-weight:600;font-size:12.5px;white-space:nowrap;}
  .wk-btn:hover{background:var(--surface-3);}
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:22px;}
  .day-tile{border:1.5px solid var(--border);border-radius:var(--radius-md);padding:13px 11px;min-height:140px;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;transition:.15s;}
  .day-tile:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
  .day-tile.readonly{cursor:default;}
  .day-tile.readonly:hover{transform:none;box-shadow:none;}
  .day-tile.readonly.aluno-clickable{cursor:pointer;}
  .day-tile.readonly.aluno-clickable:hover{border-color:var(--amber);transform:translateY(-1px);box-shadow:var(--shadow-sm);}
  .day-tile.filled-comigo{background:var(--blue-dim);border-color:var(--blue);}
  .day-tile.filled-sozinho{background:var(--amber-dim);border-color:var(--amber);}
  .day-tile.filled-reposicao{background:var(--green-dim);border-color:var(--green);}
  .day-name{font-family:'Oswald';font-size:12.5px;letter-spacing:.04em;color:var(--text);}
  .day-date{font-size:10.5px;color:var(--text-faint);margin-bottom:8px;}
  .day-tag{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:20px;display:inline-block;margin-bottom:6px;width:fit-content;}
  .day-tag.comigo{background:var(--blue);color:#fff;}
  .day-tag.sozinho{background:var(--amber);color:#332000;}
  .day-tag.reposicao{background:var(--green);color:#052912;}
  .day-empty-lbl{font-size:11.5px;color:var(--text-faint);margin-top:auto;}
  .muscle-badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;}
  .muscle-badge{color:var(--text-soft);padding:2px 8px;font-size:10px;font-weight:700;}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(5,6,9,0.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);}
  .modal{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:26px;width:100%;max-width:440px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);color:var(--text);}
  .modal h3{font-size:18px;margin-bottom:4px;color:var(--text);}
  .modal .modal-sub{font-size:12.5px;color:var(--text-soft);margin-bottom:18px;text-transform:none;letter-spacing:0;font-family:'Inter';}
  .radio-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .radio-row .radio-opt{min-width:120px;}
  .radio-opt{flex:1;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:var(--radius-sm);padding:11px;text-align:center;font-weight:600;font-size:13px;cursor:pointer;}
  .radio-opt.sel-comigo{background:var(--blue);color:#fff;border-color:var(--blue);}
  .radio-opt.sel-sozinho{background:var(--amber);color:#332000;border-color:var(--amber);}
  .radio-opt.sel-reposicao{background:var(--green);color:#052912;border-color:var(--green);}
  .radio-opt.sel-falta{background:var(--red);color:#fff;border-color:var(--red);}
  .day-tag.falta{background:var(--red);color:#fff;}
  .day-tile.filled-falta{background:var(--red-dim);border-color:var(--red);}
  .day-tile.scheduled-auto{background:var(--blue-dim);border-style:dashed;}
  .muscle-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
  .muscle-check{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text);border-radius:var(--radius-sm);padding:9px 10px;font-size:12.5px;cursor:pointer;}
  .muscle-check.checked{border-color:var(--blue);background:var(--blue-dim);color:var(--text);}
  .modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .modal-actions .btn{flex:1;min-width:100px;}
  .btn-secondary{background:var(--surface-3);color:var(--text);}
  .btn-secondary:hover{background:var(--surface-2);}
  .btn-danger{background:var(--red-dim);color:var(--red);}
  .btn-danger:hover{background:rgba(255,92,77,0.28);}

  .field-inline{display:flex;flex-direction:column;margin-bottom:16px;}
  .save-bar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:6px;}

  /* horário */
  .horario-table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px;}
  .horario-table th,.horario-table td{border:1px solid var(--border);padding:6px 8px;text-align:center;}
  .horario-table th{background:var(--surface-2);color:var(--text-soft);font-family:'Oswald';font-size:11px;letter-spacing:.03em;}
  .horario-table td{color:var(--text);}
  .horario-slot{background:var(--blue);color:#fff;border-radius:6px;padding:4px 6px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .sched-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);}
  .sched-row label{display:flex;align-items:center;gap:8px;flex:1;font-size:13px;font-weight:600;color:var(--text);}

  @media(max-width:900px){
    .login-wrap{flex-direction:column;}
    .login-side{padding:32px 24px;}
    .layout{flex-direction:column;}
    .sidebar{display:none;}
    .mobile-student-select{display:block;margin-bottom:20px;}
    .board{grid-template-columns:repeat(2,1fr);}
    .main{padding:18px 16px;}
    .topbar{padding:10px 14px;}
    .tb-title{font-size:15px;max-width:44vw;}
    .cards-row{gap:12px;}
    .score-card{min-width:0;flex:1 1 45%;padding:16px;}
  }
  @media(max-width:480px){
    .board{grid-template-columns:repeat(2,1fr);}
    .day-tile{min-height:118px;padding:10px 9px;}
    .modal{padding:20px;}
    .score-card{flex:1 1 100%;}
    .login-side h1{font-size:32px;}
  }
</style>
</head>
<body>
<div id="app"></div>

/* ============================================================
   CONFIGURAÇÃO DO BANCO DE DADOS (Firebase Realtime Database)
   ------------------------------------------------------------
   1. Crie um projeto gratuito em https://console.firebase.google.com
   2. No menu lateral, abra "Realtime Database" e clique em "Criar banco de dados"
      (escolha "Modo de teste" para começar rápido).
   3. Copie a URL do banco (algo como
      "https://SEU-PROJETO-default-rtdb.firebaseio.com") e cole abaixo,
      substituindo o texto entre aspas.
   ============================================================ */
const FIREBASE_DB_URL = "https://bruno-personal-1fb4b-default-rtdb.firebaseio.com";

const STORAGE_KEY = 'ptManagerData';
let DATA = { adminPassword:'admin123', students:[] };
let dataReady = false;
let storageUnavailable = false;
let lastSavedSnapshot = '';

function dbConfigured(){
  return FIREBASE_DB_URL && !FIREBASE_DB_URL.includes('COLE_AQUI');
}

function normalizeData(data){
  if(!data || typeof data !== 'object') data = {};
  if(!data.adminPassword) data.adminPassword = 'admin123';
  if(!Array.isArray(data.students)) data.students = data.students ? Object.values(data.students) : [];
  data.students = data.students.map(s=>{
    if(!Array.isArray(s.payments)) s.payments = s.payments ? Object.values(s.payments) : [];
    if(!Array.isArray(s.trainings)) s.trainings = s.trainings ? Object.values(s.trainings) : [];
    s.trainings = s.trainings.map(t=>({...t, muscles: Array.isArray(t.muscles) ? t.muscles : []}));
    if(!s.schedule) s.schedule = defaultSchedule();
    SCHEDULE_DAYS.forEach(d=>{ if(!s.schedule[d]) s.schedule[d] = {active:false, time:'18:00'}; });
    if(typeof s.secQuestion !== 'string') s.secQuestion = '';
    if(typeof s.secAnswer !== 'string') s.secAnswer = '';
    return s;
  });
  return data;
}

function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 12000);
  return fetch(url, {...(options||{}), signal:controller.signal}).finally(()=>clearTimeout(timer));
}

async function loadDataAsync(){
  if(!dbConfigured()){ storageUnavailable = true; return; }
  try{
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/${STORAGE_KEY}.json`, null, 12000);
    const json = await res.json();
    if(json){
      DATA = normalizeData(json);
    } else {
      DATA = { adminPassword:'admin123', students:[] };
      await saveData();
    }
  }catch(err){
    console.error('Erro ao carregar dados', err);
    storageUnavailable = true;
  }
  lastSavedSnapshot = JSON.stringify(DATA);
  dataReady = true;
}

async function saveData(){
  if(!dbConfigured()) return;
  try{
    await fetchWithTimeout(`${FIREBASE_DB_URL}/${STORAGE_KEY}.json`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(DATA)
    }, 12000);
    lastSavedSnapshot = JSON.stringify(DATA);
  }catch(err){
    console.error('Erro ao salvar dados', err);
    alert('Não foi possível salvar agora. Verifique sua conexão com a internet e tente novamente.');
  }
}

async function pollForUpdates(){
  if(storageUnavailable || !dbConfigured()) return;
  // não atualiza durante edições ativas, para não perder o que está sendo digitado
  if(modalDate || showNewStudentModal || showChangePassModal || showStudentChangePassModal) return;
  try{
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/${STORAGE_KEY}.json`, null, 10000);
    const json = await res.json();
    const asString = JSON.stringify(json||{});
    if(json && asString !== lastSavedSnapshot){
      DATA = normalizeData(json);
      lastSavedSnapshot = asString;
      render();
    }
  }catch(err){ /* silencioso */ }
}

function checkTrainingReminders(){
  if(!currentUser || currentUser.role!=='aluno') return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const student = findStudent(currentUser.studentId);
  if(!student) return;
  const now = new Date();
  const jsDay = now.getDay();
  if(jsDay===0) return; // domingo não é monitorado
  const dayIdx = jsDay-1; // 0=Segunda..5=Sábado
  const sched = getSchedule(student)[SCHEDULE_DAYS[dayIdx]];
  if(!sched || !sched.active) return;
  const [h,m] = (sched.time||'18:00').split(':').map(Number);
  const scheduledTime = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
  const diffMin = (scheduledTime - now) / 60000;
  const key = `${toISO(now)}-${sched.time}`;
  if(diffMin>0 && diffMin<=30 && !notifiedReminders.has(key)){
    notifiedReminders.add(key);
    try{
      new Notification('Treino em breve! 💪', {
        body: `Seu treino está marcado para ${sched.time} (em ${Math.round(diffMin)} min).`,
        icon: LOGO_URL
      });
    }catch(err){ /* silencioso */ }
  }
}

function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmtBR(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }

function getMonday(d){ const x=new Date(d); const day=x.getDay(); const diff = day===0? -6 : 1-day; x.setDate(x.getDate()+diff); x.setHours(0,0,0,0); return x; }
function getWeekDates(offset){
  const monday = getMonday(today);
  monday.setDate(monday.getDate()+offset*7);
  const arr=[];
  for(let i=0;i<6;i++){ const d=new Date(monday); d.setDate(monday.getDate()+i); arr.push(d); }
  return arr;
}

function findStudent(id){ return DATA.students.find(s=>s.id===id); }

function totalMonth(student, yearMonth){ // 'YYYY-MM'
  const [y,m]=yearMonth.split('-').map(Number);
  return student.payments.filter(p=>{const d=parseISO(p.date); return d.getFullYear()===y && (d.getMonth()+1)===m;}).reduce((s,p)=>s+Number(p.value),0);
}
function totalYear(student, year){
  return student.payments.filter(p=>parseISO(p.date).getFullYear()===Number(year)).reduce((s,p)=>s+Number(p.value),0);
}

function calcSuggestedPayment(student){
  const schedule = getSchedule(student);
  let count, periodLabel;
  if(student.paymentType==='mensal'){
    count = countPrevistosNoMes(student, today.getFullYear(), today.getMonth()+1);
    periodLabel = 'no mês';
  } else {
    count = SCHEDULE_DAYS.filter(d=>schedule[d] && schedule[d].active).length;
    periodLabel = 'na semana';
  }
  const total = count * Number(student.paymentValue||0);
  return { count, total, periodLabel };
}

function hasPendingPayment(student){
  if(student.paymentType==='mensal'){
    if(today.getDate() < 7) return false;
    const monthKey = `${today.getFullYear()}-${pad(today.getMonth()+1)}`;
    return totalMonth(student, monthKey) <= 0;
  } else {
    if(today.getDay() !== 6) return false; // só aparece no sábado
    const isoSet = getWeekDates(0).map(d=>toISO(d));
    const paidThisWeek = student.payments.some(p=>isoSet.includes(p.date));
    return !paidThisWeek;
  }
}

function renderYearlyRevenueChart(students, year){
  const monthLabels = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const totals = monthLabels.map((_,i)=> students.reduce((s,st)=>s+totalMonth(st, `${year}-${pad(i+1)}`),0));
  const max = Math.max(...totals, 1);
  const w=600, h=170, padTop=14, padBottom=26, padSide=4;
  const chartH = h-padTop-padBottom;
  const gap=6;
  const barW = (w-padSide*2)/12-gap;
  const currentIdx = today.getMonth();
  let bars='';
  totals.forEach((v,i)=>{
    const barH = max>0 ? Math.max((v/max)*chartH,2) : 2;
    const x = padSide+i*(barW+gap);
    const y = padTop+(chartH-barH);
    const isCurrent = i===currentIdx;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="3" fill="${isCurrent?'#4C6BFF':'#262A38'}"></rect>`;
    bars += `<text x="${(x+barW/2).toFixed(1)}" y="${h-8}" font-size="9" fill="#6A6D7C" text-anchor="middle" font-family="Inter,sans-serif">${monthLabels[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px;display:block;">${bars}</svg>`;
}

function readScheduleFromInputs(prefix){
  const sc = {};
  SCHEDULE_DAYS.forEach((d,i)=>{
    const activeEl = document.getElementById(`${prefix}-active-${i}`);
    const timeEl = document.getElementById(`${prefix}-time-${i}`);
    sc[d] = { active: activeEl ? activeEl.checked : false, time: (timeEl && timeEl.value) ? timeEl.value : '18:00' };
  });
  return sc;
}
function scheduleConflicts(schedule, excludeId){
  const conflicts = [];
  SCHEDULE_DAYS.forEach((d,i)=>{
    const sc = schedule[d];
    if(!sc || !sc.active) return;
    const hour = parseInt((sc.time||'18:00').split(':')[0],10);
    const others = DATA.students.filter(s=>{
      if(s.id===excludeId) return false;
      const osc = getSchedule(s)[d];
      if(!osc || !osc.active) return false;
      const oh = parseInt((osc.time||'18:00').split(':')[0],10);
      return oh===hour;
    });
    if(others.length>=3){
      conflicts.push(`${WEEK_LABELS[i]} às ${sc.time} já está com 3 alunos (${others.map(o=>o.name).join(', ')}).`);
    }
  });
  return conflicts;
}

/* ============ AÇÕES: TREINO ============ */
function getSchedule(student){ return student.schedule || defaultSchedule(); }
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }
function countWeekdayInMonth(year, month, jsWeekday){ // jsWeekday: 0=Dom..6=Sáb
  const total = daysInMonth(year, month);
  let count = 0;
  for(let d=1; d<=total; d++){
    if(new Date(year, month-1, d).getDay()===jsWeekday) count++;
  }
  return count;
}
function countPrevistosNoMes(student, year, month){
  const schedule = getSchedule(student);
  const total = daysInMonth(year, month);
  let count = 0;
  for(let day=1; day<=total; day++){
    const wd = new Date(year, month-1, day).getDay(); // 0=Dom..6=Sáb
    if(wd===0) continue;
    const dayKey = SCHEDULE_DAYS[wd-1];
    if(schedule[dayKey] && schedule[dayKey].active) count++;
  }
  return count;
}
function weekdayIndexFromISO(iso){ const d=parseISO(iso); const day=d.getDay(); return day===0?6:day-1; }
function changeWeek(delta){ weekOffset+=delta; render(); }

  modalStudentId = selectedStudentId;

  if(existing){

  a.href=url; a.download=`backup-personal-${toISO(today)}.json`;

function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.students){ alert('Arquivo inválido.'); return; }
      if(!confirm('Isso vai substituir todos os dados atuais pelos dados do backup. Continuar?')) return;
      DATA = normalizeData(parsed);
      saveData();
      render();
    }catch(err){ alert('Não foi possível ler o arquivo.'); }
  };
  reader.readAsText(file);
}

function renderScheduleFields(prefix, schedule){
  return WEEK_LABELS.map((label,i)=>{

    return `<div class="sched-row">

      <input type="time" id="${prefix}-time-${i}" class="input" style="margin-bottom:0;width:110px;" value="${sc.time||'18:00'}">

}

function renderHorario(student){
  const schedule = getSchedule(student);
  const headerCells = HORARIO_DAYS_IDX.map(i=>`<th>${WEEK_LABELS[i]}</th>`).join('');
  const rows = HORARIO_HOURS.map(hour=>{
    const hourLbl = `${String(hour).padStart(2,'0')}:00`;
    const cells = HORARIO_DAYS_IDX.map(i=>{
      const sc = schedule[SCHEDULE_DAYS[i]];
      let content = '';
      if(sc && sc.active){
        const schHour = parseInt((sc.time||'18:00').split(':')[0],10);
        if(schHour===hour) content = `<div class="horario-slot">${student.name.split(' ')[0]} · ${sc.time}</div>`;
      }
      return `<td>${content}</td>`;
    }).join('');
    return `<tr><td style="font-weight:600;color:var(--ink-soft);">${hourLbl}</td>${cells}</tr>`;
  }).join('');
  return `
    <div class="panel">
      <h4>Agenda semanal (Segunda a Sexta, 05:00–22:00)</h4>
      <div style="overflow-x:auto;">
        <table class="horario-table">
          <thead><tr><th></th>${headerCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
}

function renderHorarioGeral(readonly){
  const headerCells = HORARIO_DAYS_IDX.map(i=>`<th>${WEEK_LABELS[i]}</th>`).join('');
  const matrix = HORARIO_HOURS.map(hour=>{
    return HORARIO_DAYS_IDX.map(i=>{
      const dayKey = SCHEDULE_DAYS[i];
      return DATA.students.filter(s=>{
        const sc = getSchedule(s)[dayKey];
        if(!sc || !sc.active) return false;
        const h = parseInt((sc.time||'18:00').split(':')[0],10);
        return h===hour;
      });
    });
  });
  const rows = HORARIO_HOURS.map((hour,rowIdx)=>{
    const hourLbl = `${String(hour).padStart(2,'0')}:00`;
    const cells = HORARIO_DAYS_IDX.map((i,colIdx)=>{
      const matches = matrix[rowIdx][colIdx];
      let content = '';
      if(matches.length){
        const full = matches.length>=3;
        const slots = matches.map(s=>`<div class="horario-slot" style="background:${full?'var(--red)':'var(--blue)'};${readonly?'':'cursor:pointer;'}" ${readonly?'':`onclick="selectStudent('${s.id}')" title="Abrir aluno"`}>${s.name.split(' ')[0]}</div>`).join('');
        content = `<div style="display:flex;flex-direction:column;gap:3px;align-items:center;">${slots}<div style="font-size:9.5px;font-weight:700;color:${full?'var(--red)':'var(--ink-soft)'};">${matches.length}/3</div></div>`;
      }
      return `<td${matches.length?'':' style="background:#0F1015;"'}>${content}</td>`;
    }).join('');
    return `<tr><td style="font-weight:600;color:var(--ink-soft);">${hourLbl}</td>${cells}</tr>`;
  }).join('');
  const totalCells = HORARIO_DAYS_IDX.map((i,colIdx)=>{
    const totalAulas = matrix.filter(row=>row[colIdx].length>0).length;
    return `<td style="font-weight:700;color:var(--blue);">${totalAulas}</td>`;
  }).join('');
  const totalsRow = `<tr style="background:var(--surface-3);"><td style="font-weight:700;color:var(--ink-soft);">Total de aulas</td>${totalCells}</tr>`;
  return `
    <h2 style="font-size:26px;margin-bottom:4px;">Horário Geral</h2>
    <p style="color:var(--ink-soft);font-size:13px;margin-bottom:18px;">Todos os alunos e horários cadastrados, de segunda a sexta (05:00–22:00). Cada horário aceita até 3 alunos ao mesmo tempo${readonly?'.':' — clique em um aluno para abrir o cadastro dele.'}</p>
    <div class="panel">
      <div style="overflow-x:auto;">
        <table class="horario-table">
          <thead><tr><th></th>${headerCells}</tr></thead>
          <tbody>${rows}${totalsRow}</tbody>
        </table>
      </div>
    </div>`;
}

/* ============ RENDER: TREINO ============ */
function trainingTagLabel(type){ return type==='comigo' ? 'Comigo' : type==='sozinho' ? 'Sozinho' : type==='reposicao' ? 'Reposição' : 'Faltou'; }
function renderTreino(student, readonly){
  const weekDates = getWeekDates(weekOffset);
  const rangeLabel = `${fmtBR(toISO(weekDates[0]))} — ${fmtBR(toISO(weekDates[5]))}`;
  const schedule = getSchedule(student);
  const weekIsoSet = weekDates.map(d=>toISO(d));
  const weekEntries = student.trainings.filter(t=>weekIsoSet.includes(t.date));
  const previstosSemana = weekDates.filter((d,i)=> (schedule[SCHEDULE_DAYS[i]]||{}).active).length;
  const realizadosSemana = weekEntries.filter(t=>t.type==='comigo'||t.type==='sozinho'||t.type==='reposicao').length;
  const faltasSemana = weekEntries.filter(t=>t.type==='falta').length;
  const reposicaoSemana = weekEntries.filter(t=>t.type==='reposicao').length;

  const tiles = weekDates.map((d,i)=>{
    const iso = toISO(d);
    const entry = student.trainings.find(t=>t.date===iso);
    const sched = schedule[SCHEDULE_DAYS[i]] || {active:false,time:'18:00'};
    let cls='day-tile';
    let onclickAttr = '';
    if(!readonly){
      cls += '';
      onclickAttr = `onclick="openTrainingModal('${iso}')"`;
    } else {
      cls += ' readonly';
      const alunoCanMark = (!entry && !sched.active) || (entry && entry.type==='sozinho');
      if(alunoCanMark){
        cls += ' aluno-clickable';
        onclickAttr = `onclick="openTrainingModalAluno('${iso}')"`;
      }
    }
    let bodyHtml;
    if(entry){
      cls += entry.type==='comigo' ? ' filled-comigo' : entry.type==='sozinho' ? ' filled-sozinho' : entry.type==='reposicao' ? ' filled-reposicao' : ' filled-falta';
      const badges = (entry.muscles||[]).map(m=>{
        return `<span class="muscle-badge">${m}</span>`;
      }).join('');
      const timeLbl = (entry.type==='comigo'||entry.type==='reposicao') && entry.time ? ` · ${entry.time}` : '';
      bodyHtml = `<span class="day-tag ${entry.type}">${trainingTagLabel(entry.type)}${timeLbl}</span><div class="muscle-badges">${badges}</div>`;
    } else if(sched.active){
      cls += ' scheduled-auto';
      bodyHtml = `<span class="day-tag comigo">Previsto · ${sched.time}</span><div class="day-empty-lbl">${readonly?'':'Clique para confirmar ou editar'}</div>`;
    } else {
      const emptyLbl = readonly ? 'Clique para marcar que treinou sozinho' : 'Clique para marcar';
      bodyHtml = `<div class="day-empty-lbl">${emptyLbl}</div>`;
    }
    return `
      <div class="${cls}" ${onclickAttr}>
        <div class="day-name">${WEEK_SHORT[i]}</div>
        <div class="day-date">${fmtBR(iso)}</div>
        ${bodyHtml}
      </div>`;
  }).join('');

  const [ty, tm] = treinoMonth.split('-').map(Number);
  const monthHistory = student.trainings.filter(t=>t.date.startsWith(treinoMonth)).sort((a,b)=>b.date.localeCompare(a.date));
  const historyRows = monthHistory.map(t=>{
    const badges = (t.muscles||[]).map(m=>{
      return `<span class="muscle-badge">${m}</span>`;
    }).join(' ');
    const timeLbl = (t.type==='comigo'||t.type==='reposicao') && t.time ? ` · ${t.time}` : '';
    return `<tr>
      <td>${fmtBR(t.date)}</td>
      <td><span class="day-tag ${t.type}" style="display:inline-block;">${trainingTagLabel(t.type)}${timeLbl}</span></td>
      <td>${badges}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="3" style="color:var(--ink-soft);padding:20px 8px;">Nenhum treino registrado neste mês.</td></tr>`;

  const previstosMes = countPrevistosNoMes(student, ty, tm);
  const realizadosMes = monthHistory.filter(t=>t.type==='comigo'||t.type==='sozinho'||t.type==='reposicao').length;
  const faltasMes = monthHistory.filter(t=>t.type==='falta').length;
  const reposicaoMes = monthHistory.filter(t=>t.type==='reposicao').length;

  return `
    <div class="week-nav">
      <button class="wk-btn" onclick="changeWeek(-1)">← Semana anterior</button>
      <div class="wk-label">${rangeLabel}${weekOffset===0?' (semana atual)':''}</div>
      <button class="wk-btn" onclick="changeWeek(1)">Próxima semana →</button>
    </div>
    <div class="board">${tiles}</div>
    <div style="display:flex;flex-wrap:wrap;gap:22px;margin-bottom:24px;font-size:13px;color:var(--ink-soft);">
      <span>Treinos previstos na semana: <b style="color:var(--ink-soft);">${previstosSemana}</b></span>
      <span>Treinos realizados: <b style="color:var(--ink-soft);">${realizadosSemana}</b></span>
      <span>Aulas de reposição: <b style="color:var(--ink-soft);">${reposicaoSemana}</b></span>
      <span>Faltas na semana: <b style="color:var(--ink-soft);">${faltasSemana}</b></span>
    </div>
    <div class="panel">
      <h4>Histórico do mês</h4>
      <div style="margin-bottom:16px;">
        <label class="field-label">Mês</label>
        <input type="month" class="input" style="margin-bottom:0;max-width:200px;" value="${treinoMonth}" onchange="treinoMonth=this.value; render();">
      </div>
      <div class="cards-row" style="margin-bottom:20px;">
        <div class="score-card accent-blue"><div class="lbl">Treinos previstos no mês</div><div class="val">${previstosMes}</div></div>
        <div class="score-card accent-green"><div class="lbl">Treinos realizados no mês</div><div class="val">${realizadosMes}</div></div>
        <div class="score-card" style="border-color:var(--green);"><div class="lbl" style="color:var(--green);">Aulas de reposição no mês</div><div class="val" style="color:var(--green);">${reposicaoMes}</div></div>
        <div class="score-card accent-red"><div class="lbl">Faltas no mês</div><div class="val">${faltasMes}</div></div>
      </div>
      <div class="table-scroll">
      <table>
        <thead><tr><th>Data</th><th>Tipo</th><th>Grupamento muscular</th></tr></thead>
        <tbody>${historyRows}</tbody>
      </table>
      </div>
    </div>`;
}

}

/* ============ RENDER: ADMIN APP ============ */
function renderAdminApp(){
  const students = [...DATA.students].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR',{sensitivity:'base'}));
  const thisMonthKey = `${today.getFullYear()}-${pad(today.getMonth()+1)}`;
  const totalMesTodos = students.reduce((s,st)=>s+totalMonth(st, thisMonthKey),0);
  const totalAnoTodos = students.reduce((s,st)=>s+totalYear(st, today.getFullYear()),0);
  const sidebarItems = students.map(s=>{
    const pending = hasPendingPayment(s);
    return `
    <div class="student-item ${selectedStudentId===s.id?'active':''}" onclick="selectStudent('${s.id}')">
      <div class="s-name">${s.name}${pending?' <span style="background:var(--red);color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;">PAGAMENTO PENDENTE</span>':''}</div>
      <div class="s-plan">${s.paymentType} · ${money(s.paymentValue)}/aula</div>
    </div>`;
  }).join('') || `<div style="color:var(--ink-soft);font-size:13px;padding:10px 4px;">Nenhum aluno ainda.</div>`;
  const sidebarSummary = `
    <div style="margin-top:14px;padding-top:14px;border-top:1.5px solid var(--border);font-size:12.5px;color:var(--ink-soft);">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Total de alunos</span><b style="color:var(--ink);">${students.length}</b></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>Recebido no mês</span><b style="color:var(--blue);">${money(totalMesTodos)}</b></div>
      <div style="display:flex;justify-content:space-between;"><span>Acumulado no ano</span><b style="color:var(--green);">${money(totalAnoTodos)}</b></div>
    </div>`;
  const mobileSelectOptions = students.map(s=>`<option value="${s.id}" ${selectedStudentId===s.id?'selected':''}>${hasPendingPayment(s)?'⚠ ':''}${s.name}</option>`).join('');
  const mobileStudentSelect = `
    <select class="input mobile-student-select" onchange="if(this.value){selectStudent(this.value);}else{goHome();}">
      <option value="">— Alunos cadastrados —</option>
      ${mobileSelectOptions}
    </select>`;

  let mainContent = '';
  const student = selectedStudentId ? findStudent(selectedStudentId) : null;

  if(showGeneralSchedule){
    mainContent = renderHorarioGeral(false);
  } else if(!student){
    const [selYear, selMonthNum] = homeMonth.split('-').map(Number);
    const selMonthKey = homeMonth;
    const totalMesSel = students.reduce((s,st)=>s+totalMonth(st, selMonthKey),0);
    const totalAnoSel = students.reduce((s,st)=>s+totalYear(st, selYear),0);
    const todayIdx = today.getDay()===0 ? null : today.getDay()-1; // 0=Seg..5=Sáb, null se domingo
    let aulasHoje = 0;
    if(todayIdx!==null){
      const dayKey = SCHEDULE_DAYS[todayIdx];
      const horasComAluno = new Set();
      students.forEach(s=>{
        const sc = getSchedule(s)[dayKey];
        if(sc && sc.active) horasComAluno.add((sc.time||'18:00').split(':')[0]);
      });
      aulasHoje = horasComAluno.size;
    }
    const previstosMesTodos = students.reduce((sum,st)=> sum + countPrevistosNoMes(st, selYear, selMonthNum), 0);
    const dadosMesTodos = students.reduce((sum,st)=> sum + st.trainings.filter(t=>t.date.startsWith(selMonthKey) && t.type==='comigo').length, 0);
    const faltasMesTodos = students.reduce((sum,st)=> sum + st.trainings.filter(t=>t.date.startsWith(selMonthKey) && t.type==='falta').length, 0);
    const recebimentoPrevistoTodos = students.reduce((sum,st)=> sum + (countPrevistosNoMes(st, selYear, selMonthNum) * Number(st.paymentValue||0)), 0);

    mainContent = `
      <div class="section-title">Resumo geral</div>
      <div class="big-cards">
        <div class="big-card">
          <div class="top" style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <h3>Financeiro</h3>
            <input type="month" class="input" style="margin-bottom:0;max-width:160px;font-size:12px;padding:7px 10px;" value="${homeMonth}" onchange="homeMonth=this.value; render();">
          </div>
          <div class="stat-row"><span class="lbl">Recebido no mês selecionado (todos)</span><span class="val" style="color:var(--blue);">${money(totalMesSel)}</span></div>
          <div class="stat-row"><span class="lbl">Recebimento previsto no mês (todos)</span><span class="val" style="color:var(--amber);">${money(recebimentoPrevistoTodos)}</span></div>
          <div class="stat-row"><span class="lbl">Acumulado em ${selYear} (todos)</span><span class="val" style="color:var(--green);">${money(totalAnoSel)}</span></div>
          <div class="chart-wrap">
            <div class="chart-caption">Recebido por mês em ${selYear}</div>
            ${renderYearlyRevenueChart(students, selYear)}
          </div>
        </div>
        <div class="big-card">
          <div class="top"><h3>Treino</h3></div>
          <div class="stat-row"><span class="lbl">Aulas hoje</span><span class="val" style="color:var(--blue);">${aulasHoje}</span></div>
          <div class="stat-row"><span class="lbl">Total de treinos previstos no mês</span><span class="val" style="color:var(--blue);">${previstosMesTodos}</span></div>
          <div class="stat-row"><span class="lbl">Total de treinos dados no mês</span><span class="val" style="color:var(--green);">${dadosMesTodos}</span></div>
          <div class="stat-row"><span class="lbl">Faltas no mês (todos)</span><span class="val" style="color:var(--red);">${faltasMesTodos}</span></div>
        </div>
      </div>
      <div class="section-title">Alunos cadastrados</div>
      <div class="cards-row">
        <div class="score-card accent-blue"><div class="lbl">Total de alunos</div><div class="val">${students.length}</div></div>
      </div>
      <div class="empty-state">
        <h2>Selecione um aluno</h2>
        <p>Escolha um aluno na lista ao lado para ver o financeiro e os treinos, ou cadastre um novo aluno.</p>
      </div>`;
  } else {
    mainContent = `
      <h2 style="font-size:26px;margin-bottom:4px;">${student.name}</h2>
      <p style="color:var(--ink-soft);font-size:13px;margin-bottom:18px;">Usuário: ${student.username}</p>
      <div class="tabs">
        <button class="tab-btn ${activeTab==='financeiro'?'active':''}" onclick="activeTab='financeiro';render()">Financeiro</button>
        <button class="tab-btn ${activeTab==='treino'?'active':''}" onclick="activeTab='treino';render()">Treino</button>
        <button class="tab-btn ${activeTab==='horario'?'active':''}" onclick="activeTab='horario';render()">Horário</button>
        <button class="tab-btn ${activeTab==='perfil'?'active':''}" onclick="activeTab='perfil';render()">Perfil</button>
      </div>
      ${activeTab==='financeiro' ? renderFinanceiro(student,false) : activeTab==='treino' ? renderTreino(student,false) : activeTab==='horario' ? renderHorario(student) : renderPerfil(student)}
    `;
  }

  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="tb-left">
        <img src="${LOGO_URL}" alt="logo" style="width:38px;height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;">
        <div><div class="tb-title">Bruno Personal Trainer</div><div class="tb-sub">Administrador · BRUNOPERSONAL 27 998860938</div></div>
      </div>
      <div class="tb-right">
        <button class="tb-btn" onclick="goHome()">Página inicial</button>
        <button class="tb-btn" style="background:${showGeneralSchedule?'var(--blue)':'rgba(255,255,255,0.08)'};" onclick="openGeneralSchedule()">Horário Geral</button>
        <button class="tb-btn" style="background:var(--blue);" onclick="openNewStudentModal()">+ Novo aluno</button>
        <button class="tb-btn" onclick="exportBackup()">Exportar backup</button>
        <button class="tb-btn" onclick="triggerImport()">Importar backup</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;" onchange="importBackup(event)">
        ${!appIsInstalled ? `<button class="tb-btn" onclick="installApp()">⊕ Instalar app</button>` : ''}
        <button class="tb-btn" onclick="openChangePass()">Alterar senha</button>
        <button class="tb-btn" onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="layout">
      <div class="sidebar">
        <h3>Alunos</h3>
        ${sidebarItems}
        ${sidebarSummary}
      </div>
      <div class="main">${mobileStudentSelect}${mainContent}</div>
    </div>
    ${renderNewStudentModal()}
    ${renderChangePassModal()}
    ${renderTrainingModal(false)}
  `;
}

/* ============ RENDER: ALUNO APP ============ */
function renderConfiguracoes(student){
  const supported = 'Notification' in window;
  const perm = supported ? Notification.permission : 'unsupported';
  let statusText, statusColor;
  if(!supported){ statusText='Seu navegador não é compatível com notificações.'; statusColor='var(--red)'; }
  else if(perm==='granted'){ statusText='Notificações ativadas neste navegador ✓'; statusColor='var(--green)'; }
  else if(perm==='denied'){ statusText='Notificações bloqueadas — ative manualmente nas permissões do site, no seu navegador.'; statusColor='var(--red)'; }
  else { statusText='Notificações ainda não ativadas.'; statusColor='var(--ink-soft)'; }
  return `
    <div class="panel">
      <h4>Notificações de treino</h4>
      <p style="font-size:13.5px;color:var(--ink-soft);line-height:1.6;margin-bottom:16px;">
        Ative para receber um aviso 30 minutos antes do horário marcado do seu treino.
        Funciona enquanto esta página estiver aberta no seu navegador (mesmo minimizada) — se o navegador for totalmente fechado, o aviso não chega.
      </p>
      <p style="font-size:13.5px;font-weight:700;color:${statusColor};margin-bottom:16px;">${statusText}</p>
      ${(supported && perm!=='granted') ? `<button class="btn btn-primary" onclick="requestNotificationPermission()">Ativar notificações</button>` : ''}
    </div>`;
}

function renderAlunoApp(){
  const student = findStudent(currentUser.studentId);
  if(!student){ logout(); return; }
  const content = activeTab==='financeiro' ? renderFinanceiro(student,true) : activeTab==='treino' ? renderTreino(student,true) : activeTab==='horario' ? renderHorario(student) : activeTab==='horarioGeral' ? renderHorarioGeral(true) : renderConfiguracoes(student);
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="tb-left">
        <img src="${LOGO_URL}" alt="logo" style="width:38px;height:38px;object-fit:contain;background:#fff;border-radius:8px;padding:3px;">
        <div><div class="tb-title">${student.name}</div><div class="tb-sub">Área do aluno · Bruno Personal Trainer · 27 998860938</div></div>
      </div>
      <div class="tb-right">
        ${!appIsInstalled ? `<button class="tb-btn" onclick="installApp()">⊕ Instalar app</button>` : ''}
        <button class="tb-btn" onclick="openStudentChangePass()">Alterar minha senha</button>
        <button class="tb-btn" onclick="logout()">Sair</button>
      </div>
    </div>
    <div class="layout">
      <div class="main" style="width:100%;">
        <div class="tabs">
          <button class="tab-btn ${activeTab==='financeiro'?'active':''}" onclick="activeTab='financeiro';render()">Financeiro</button>
          <button class="tab-btn ${activeTab==='treino'?'active':''}" onclick="activeTab='treino';render()">Treino</button>
          <button class="tab-btn ${activeTab==='horario'?'active':''}" onclick="activeTab='horario';render()">Horário</button>
          <button class="tab-btn ${activeTab==='horarioGeral'?'active':''}" onclick="activeTab='horarioGeral';render()">Horário Geral</button>
          <button class="tab-btn ${activeTab==='config'?'active':''}" onclick="activeTab='config';render()">Configurações</button>
        </div>
        ${content}
      </div>
    </div>
    ${renderTrainingModal(true)}
    ${renderStudentChangePassModal()}
  `;
}

/* ============ RENDER PRINCIPAL ============ */
function render(){
  if(!currentUser){ renderLogin(); return; }
  if(currentUser.role==='admin'){ renderAdminApp(); }
  else { renderAlunoApp(); }
}

function renderLoadingScreen(){
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--graphite);color:#fff;">
      <img src="${LOGO_URL}" alt="logo" style="width:70px;height:70px;object-fit:contain;background:#fff;border-radius:14px;padding:6px;">
      <div style="font-family:'Oswald';letter-spacing:.05em;">Carregando dados...</div>
    </div>`;
}

function renderStorageErrorScreen(){
  const notConfigured = !dbConfigured();
  document.getElementById('app').innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;background:var(--bg);">
      <div style="max-width:460px;text-align:center;">
        <h2 style="margin-bottom:14px;">${notConfigured?'Banco de dados não configurado':'Não foi possível conectar ao banco de dados'}</h2>
        <p style="color:var(--text-soft);font-size:14px;line-height:1.6;margin-bottom:22px;">
          ${notConfigured
            ? 'Abra o arquivo .html, encontre a linha <code>const FIREBASE_DB_URL = "COLE_AQUI_A_URL_DO_SEU_FIREBASE";</code> perto do início do &lt;script&gt; e cole a URL do seu banco Firebase Realtime Database no lugar do texto entre aspas.'
            : 'A conexão demorou demais ou falhou. Verifique sua internet e tente novamente.'}
        </p>
        ${notConfigured ? '' : `<button class="btn btn-primary" style="width:auto;padding:13px 26px;" onclick="retryLoad()">Tentar novamente</button>`}
      </div>
    </div>`;
}

async function retryLoad(){
  storageUnavailable = false;
  renderLoadingScreen();
  await loadDataAsync();
  if(storageUnavailable){ renderStorageErrorScreen(); return; }
  render();
}

/* ============ INSTALAÇÃO DO APP (PWA) ============ */
let deferredInstallPrompt = null;
let appIsInstalled = false;

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  render();
});

window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  appIsInstalled = true;
  render();
});

if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches){
  appIsInstalled = true;
}

function installApp(){
  if(!deferredInstallPrompt){
    alert('A instalação automática não está disponível agora neste navegador.\n\nIsso funciona no Google Chrome ou Microsoft Edge, no computador. Se o botão não aparecer, procure o ícone de instalação (⊕ ou um monitor com seta) na barra de endereço do navegador.');
    return;
  }
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.then(()=>{
    deferredInstallPrompt = null;
    render();
  });
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* silencioso */ });
  });
}

(async function initApp(){
  renderLoadingScreen();
  await loadDataAsync();
  if(storageUnavailable){ renderStorageErrorScreen(); return; }
  render();
  setInterval(pollForUpdates, 4000);
  setInterval(checkTrainingReminders, 60000);
  checkTrainingReminders();
})();
</script>
